# Неизменная конфигурация (пути, стартовое расписание, тон).
# Секреты (BOT_TOKEN, OWNER_ID) — в .env, НЕ здесь.

[vault]
# Абсолютный путь к корню Obsidian-vault (Органон).
vault_path = "/Users/dimitrisimonyan/Yandex.Disk.localized/Self-Education/Knowledge base/Obsidian/Органон"
# Папка дневника состояний внутри vault.
diary_subpath = "02 — Внутренний мир/Дневник состояний"
# Папка для вложений (голосовые).
attachments_subpath = "02 — Внутренний мир/Дневник состояний/attachments"
# Папка для отдельных заметок-«мыслей» (кнопка 📝 Заметка → отдельный файл с тегами).
ideas_subpath = "03 — Идеи и мысли"
# Файл задач таск-менеджера (один файл-чеклист, синхронизируется с ботом и Todoist).
tasks_subpath = "04 — Цели и задачи/Задачи.md"
# Папка для вложений из заметок (картинки, документы, видео).
files_subpath = "08 — Шаблоны и ресурсы/Файлы"

[storage]
# Путь к SQLite относительно корня проекта (или абсолютный).
db_path = "data/assistant.db"

[schedule]
# Стартовое расписание (§2 MASTER-PLAN). Времена калибруются после 2 недель —
# меняются в БД через /settings, не правкой этого файла. Здесь только seed.
morning_start = "10:30"
morning_end   = "11:00"
day_start     = "15:00"
day_end       = "16:00"
evening_start = "22:30"
evening_end   = "23:00"
# День недели «лёгкого дня» (только утро). 0=понедельник … 6=воскресенье.
light_day_weekday = 6

[outbox]
# Период воркера доставки записи в Obsidian, секунды.
poll_interval_seconds = 30
# Максимум попыток перед тем как пометить запись проблемной (но не удалять).
max_attempts = 12
# База экспоненциального backoff, секунды (delay = base * 2**attempts, с потолком).
backoff_base_seconds = 15
backoff_cap_seconds = 1800

[scheduler]
# misfire_grace_time: если daemon спал/лежал — не «выстреливать» пачкой (§1.2).
misfire_grace_time_seconds = 1800
coalesce = true
# Интервал переспроса (минуты): если окно слота прошло, а состояние не отмечено —
# переспрашивать каждые N минут до отметки или до конца дня (23:59).
reask_interval_minutes = 30

[todoist]
# Интеграция таск-менеджера с Todoist. Токен — в .env (TODOIST_TOKEN), НЕ здесь.
# enabled включается автоматически, если задан TODOIST_TOKEN. Можно форсить здесь.
enabled = true
# Проект Todoist для задач (id строкой). Пусто = Inbox.
project_id = ""
# Период фонового синка (pull из Todoist + push в Obsidian/Todoist), секунды.
# 60с — баланс отзывчивости и лимитов Todoist; плюс синк при открытии списка в боте.
poll_interval_seconds = 60

[logging]
# Уровень логов. Содержимое ответов пользователя НИКОГДА не логируется.
level = "INFO"
# Ротация файла bot.log.
max_bytes = 2000000
backup_count = 5

[channel]
# Мониторинг Telegram-группы с топиками. Установи enabled=true и заполни channel_id.
enabled = true
# ID группы (отрицательный). Найти: добавь @userinfobot в группу или пересли сообщение.
channel_id = -1002159858140  # Дневник осознанности
# Реакция бота для пометки "спаршено"
parsed_reaction = "👍"
# Реакция пользователя как ручной триггер парсинга (для пропущенных > 24ч)
trigger_reaction = "👁"
# Obsidian-папка для топиков без явного маппинга И без известного имени (и для General).
default_topic_folder = "03 — Идеи и мысли/Telegram"
# Авто-сохранение по имени топика: непривязанный топик → <topic_name_base>/<имя топика>.
# Имя берётся через GramJS get_forum_topics и кэшируется в topic_names_cache.
# Приоритет: явный [channel.topics] > имя топика > default_topic_folder.
topic_name_base = "02 — Внутренний мир"
telegram_driver = "~/Desktop/personal os/tools/telegram/driver.cjs"
topic_names_cache = "data/topic_names.json"   # относительно корня бота
topic_refresh_interval_sec = 300              # троттлинг обновления имён

# Маппинг topic_id → Obsidian-папка. Каждый топик «Дневника осознанности» пишет
# в свою папку с именем = названию топика (сверено через get_forum_topics 2026-06-12).
