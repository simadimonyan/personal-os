function bar(name,n,max){return `<div class="barrow"><span class="nm" title="${esc(name)}">${esc(name)}</span>
  <span class="track"><span class="fill" style="width:${Math.round(n/max*100)}%"></span></span><span class="n">${n}</span></div>`;}
function srcBar(x,max){return `<div class="barrow clickrow" onclick="radarPickSource('${jsq(x.k)}')" title="фильтровать: ${esc(x.k)}">
  <span class="nm">${esc(x.k)}</span><span class="track"><span class="fill" style="width:${Math.round(x.n/max*100)}%"></span></span>
  <span class="n">${x.n}</span><span style="font-family:var(--mono);font-size:var(--fs-xs);min-width:62px;text-align:right;color:${x.stale?'var(--err)':'var(--dim)'}">${esc(x.ago)}</span></div>`;}
function radarItemRow(m){return `<div class="matrow clickrow" onclick="openRadarItem(${m.id})" title="открыть материал">
  <span class="src" title="${esc(m.source)}"><span class="pill" style="padding:0 5px">${m.kind==='rss'?'rss':'tg'}</span> ${esc(m.source)}</span>
  <span class="ti">${esc(m.title)}</span><span class="tm">${esc(m.ts)}</span></div>`;}
// фильтры
function radarApply(){radarState.kind=$('#rKind').value;radarState.source=$('#rSource').value;
  radarState.since=parseInt($('#rSince').value)||0;radarSearch(true);}
function radarPickSource(s){radarState.source=(radarState.source===s?'':s);if($('#rSource'))$('#rSource').value=radarState.source;radarSearch(true);}
function radarPickKind(k){radarState.kind=(radarState.kind===k?'':k);if($('#rKind'))$('#rKind').value=radarState.kind;radarSearch(true);}
function radarTopic(t){radarState.q=t;if($('#rQ'))$('#rQ').value=t;radarSearch(true);}
function radarChips(){
  const box=$('#radarChips');if(!box)return;const c=[];
  if(radarState.q)c.push(['поиск: '+radarState.q,"radarState.q='';$('#rQ').value='';radarSearch(true)"]);
  if(radarState.kind)c.push(['тип: '+radarState.kind,"radarState.kind='';$('#rKind').value='';radarSearch(true)"]);
  if(radarState.source)c.push(['источник: '+radarState.source,"radarState.source='';$('#rSource').value='';radarSearch(true)"]);
  if(radarState.since)c.push(['период: '+(PERIODS.find(p=>p[0]===radarState.since)||[,''])[1],"radarState.since=0;$('#rSince').value='0';radarSearch(true)"]);
  box.innerHTML=c.map(x=>`<span class="pill clickrow" onclick="${x[1]}">${esc(x[0])} ✕</span>`).join('')+
    (c.length>1?`<span class="pill clickrow" onclick="radarReset()" style="color:var(--err)">сбросить всё ✕</span>`:'');
}
function radarReset(){radarState={q:'',kind:'',source:'',since:0,offset:0};
  if($('#rQ'))$('#rQ').value='';if($('#rKind'))$('#rKind').value='';if($('#rSource'))$('#rSource').value='';if($('#rSince'))$('#rSince').value='0';
  radarSearch(true);}
function radarQS(){return `q=${encodeURIComponent(radarState.q)}&kind=${radarState.kind}&source=${encodeURIComponent(radarState.source)}&since=${radarState.since}&offset=${radarState.offset}`;}
async function radarSearch(reset){
  if(reset)radarState.offset=0;
  if($('#rQ'))radarState.q=$('#rQ').value.trim();
  radarChips();
  const list=$('#radarResults');if(!list)return;
  if(reset){list.innerHTML='<div class="empty">ищу…</div>';
    api('/api/radar/facets?'+radarQS()).then(f=>{if(route==='radar'&&f&&f.by_kind)renderRadarFacets(f);}).catch(()=>{});}
  let d;try{d=await api('/api/radar/search?'+radarQS());}catch{d={items:[],total:0};}
  if(route!=='radar')return;
  radarHasMore=d.has_more;radarTotal=d.total;
  if($('#rCount'))$('#rCount').textContent=d.total+' '+plural(d.total,'материал','материала','материалов');
  if(!d.items.length){list.innerHTML=`<div class="empty">Ничего не найдено по текущему срезу.${(radarState.q||radarState.kind||radarState.source||radarState.since)?'<div class="act-line"><button class="btn sm" onclick="radarReset()">сбросить фильтры</button></div>':''}</div>`;
    $('#radarMore').innerHTML='';return;}
  const html=d.items.map(radarItemRow).join('');
  if(reset)list.innerHTML=html;else list.insertAdjacentHTML('beforeend',html);
  $('#radarMore').innerHTML=radarHasMore?`<button class="btn sm" onclick="radarMore()">показать ещё (${radarTotal-radarState.offset-d.items.length} осталось)</button>`:
    (d.total>50?'<span class="hint-i" style="color:var(--dim)">— всё показано —</span>':'');
}
async function radarMore(){radarState.offset+=50;await radarSearch(false);}

function renderRadarSources(){

    <div class="form">
      <div class="fld" style="max-width:280px"><label>Лимит на источник за прогон <span class="hint-i">max_per_source · больше = больше постов с активных лент</span></label>

      <div class="set-row" style="padding:2px 0"><span>Парсить полный текст по ссылке
        <span class="hint-i" style="color:var(--dim);font-size:var(--fs-xs)">— радар перейдёт по ссылке RSS-материала и вытащит всю статью, а не короткий анонс</span></span>
        <span class="sp"></span><button class="toggle ${radarSrcState.full?'on':''}" id="rsFull" onclick="this.classList.toggle('on')" aria-label="полный текст"></button></div>
      <div class="fld"><label>RSS-ленты <span class="hint-i">название + ссылка на rss</span></label>
        <div id="rsRss">${rssRows||'<div class="hint-i" style="color:var(--dim)">пока пусто</div>'}</div>
        <button class="btn sm" style="width:max-content;margin-top:6px" onclick="addRadarSrc('rss')">${icon('i-add')} добавить RSS</button></div>
      <div class="fld"><label>Telegram-каналы <span class="hint-i">название + @username или числовой id</span></label>
        <div id="rsTg">${tgRows||'<div class="hint-i" style="color:var(--dim)">пока пусто</div>'}</div>
        <button class="btn sm" style="width:max-content;margin-top:6px" onclick="addRadarSrc('tg')">${icon('i-add')} добавить канал</button></div>
      <div class="actions"><button class="btn primary" onclick="saveRadarSources(this)">${icon('i-save')} сохранить источники</button>
        <span class="hint-i" style="color:var(--dim)">применится при следующем прогоне news-ingest (можно прогнать вручную в Конструкторе задач)</span></div>
    </div></div>`;
}
function srcEditRow(kind,name,val){
  const ph=kind==='rss'?'https://…/rss':'@username или id';
  return `<div class="${kind}-row" style="display:flex;gap:6px;margin-bottom:6px">
    <input type="text" class="src-name" placeholder="название" value="${esc(name||'')}" style="flex:1">
    <input type="text" class="src-val" placeholder="${ph}" value="${esc(val||'')}" style="flex:2">
    <button class="btn sm danger" onclick="this.parentNode.remove()" title="убрать">${icon('i-trash')}</button></div>`;
}
function addRadarSrc(kind){
  const cont=kind==='rss'?$('#rsRss'):$('#rsTg');if(!cont)return;
  if(cont.querySelector('.hint-i'))cont.innerHTML='';
  cont.insertAdjacentHTML('beforeend',srcEditRow(kind,'',''));
}
async function saveRadarSources(btn){
  const collect=sel=>[...document.querySelectorAll(sel)].map(row=>({
    name:row.querySelector('.src-name').value.trim(),
    val:row.querySelector('.src-val').value.trim()})).filter(x=>x.val);
  const rss=collect('#rsRss .rss-row').map(x=>({name:x.name,url:x.val}));
  const tg=collect('#rsTg .tg-row').map(x=>({name:x.name,chat:x.val}));
  if(!rss.length&&!tg.length){toast('✗ добавь хотя бы один источник');return;}
  const body={max_per_source:parseInt($('#rsMax').value)||15,fetch_full:$('#rsFull').classList.contains('on'),rss,telegram:tg};
  btn.disabled=true;const old=btn.innerHTML;btn.innerHTML='…сохраняю';
  let r;try{r=await api('/api/radar/sources/save',{method:'POST',body:JSON.stringify(body)});}catch(e){r={ok:false,out:e.message};}
  btn.disabled=false;btn.innerHTML=old;toast(r.ok?'✓ '+r.out:'✗ '+r.out);
  if(r.ok)loadRadarSources();
}

  const jobs=(d.jobs||[]).filter(j=>!j.is_example);
  const builder=`<div class="panel"><div class="h">${icon('i-add')}<span class="t">Конструктор крон-задачи</span></div>
    <div class="form" id="cronForm" data-kind="shell">
      <div class="seg" id="cronKind">
        <button class="on" data-k="shell" onclick="cronKind('shell')">Скрипт / команда</button>
        <button data-k="prompt" onclick="cronKind('prompt')">Промпт к Claude</button></div>
      <div class="two">
        <div class="fld"><label>ID задачи <span class="hint-i">латиница-через-дефис</span></label><input id="cId" type="text" placeholder="my-task"></div>
        <div class="fld"><label>Расписание <span class="hint-i">cron или @every</span></label><input id="cSched" type="text" placeholder="0 9 * * *   или   @every 30m"></div></div>
      <div class="fld" id="cShellWrap"><label>Shell-команда / путь к скрипту <span class="hint-i">запускается из каталога services</span></label>
        <textarea id="cShell" placeholder="bash '/Users/.../script.sh' arg1 arg2"></textarea></div>
      <div class="fld" id="cPromptWrap" style="display:none"><label>Промпт к Claude</label>
        <textarea id="cPrompt" placeholder="Что должен сделать Claude по расписанию…"></textarea></div>
      <div class="two">
        <div class="fld" id="cModelWrap" style="display:none"><label>Модель</label>
          <select id="cModel"><option value="">по умолчанию</option><option>haiku</option><option>sonnet</option><option>opus</option></select></div>
        <div class="fld"><label>Требует ресурсов <span class="hint-i">requires · через запятую, можно пусто</span></label><input id="cReq" type="text" placeholder="internet,claude"></div></div>
      <div class="fld"><label>Описание</label><input id="cDesc" type="text" placeholder="Что делает задача — увидишь в Обзоре"></div>
      <div class="two">
        <div class="fld"><label>Тип вывода результата</label>
          <select id="cOutKind"><option value="">лог (по умолчанию)</option><option value="obsidian">Obsidian-заметка</option><option value="file">файл</option><option value="telegram">Telegram</option></select></div>
        <div class="fld"><label>Куда писать <span class="hint-i">путь / @канал, если выбрал выше</span></label><input id="cOut" type="text" placeholder="оставь пусто для лога"></div></div>
      <div class="actions"><button class="btn primary" onclick="createCron(this)">${icon('i-add')} создать задачу</button>
        <span class="hint-i" style="color:var(--dim)">появится в списке ниже, в Обзоре и на странице сервиса «Cron»</span></div>
    </div></div>`;
  const list=`<div class="panel"><div class="h"><span class="t">Существующие задачи</span><span class="sp"></span><span class="badge">${jobs.length}</span></div>
    ${jobs.length?jobs.map(cronAdminRow).join(''):'<div class="empty">Задач пока нет — создай первую выше.</div>'}</div>`;
  $('#content').innerHTML=`<div class="svccap">${icon('i-add')} Крон-задачи создаются и удаляются прямо из UI — на основе своих скриптов (shell) или промптов к Claude. Запуск, вкл/выкл и логи — на странице сервиса «Cron».</div>`+builder+list;
}
function cronKind(k){const f=$('#cronForm');if(f)f.dataset.kind=k;
  document.querySelectorAll('#cronKind button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  $('#cShellWrap').style.display=k==='shell'?'':'none';
  $('#cPromptWrap').style.display=k==='prompt'?'':'none';
  $('#cModelWrap').style.display=k==='prompt'?'':'none';}
function cronAdminRow(j){
  const h=j.health,chip=`<span class="chip ${HCLASS[h]||'unknown'}">${DOT[h]||'—'} ${HWORD[h]||h}</span>`;
  return `<div class="row"><div class="meta"><div class="name">${chip}<span class="id">${esc(j.id)}</span></div>
    <div class="desc">${esc(j.description||'(без описания)')}</div></div>
    <div class="when"><b title="${esc(j.schedule)}">${esc(humanSchedule(j.schedule))}</b><br>↻ ${esc(j.next_run)}</div>
    <div class="acts"><button class="btn sm danger" onclick="deleteCron('${jsq(j.id)}',this)">${icon('i-trash')} удалить</button></div></div>`;}
async function createCron(btn){
  const kind=($('#cronForm').dataset.kind)||'shell';
  const body={id:$('#cId').value,schedule:$('#cSched').value,kind,desc:$('#cDesc').value,requires:$('#cReq').value};
  if(kind==='prompt'){body.prompt=$('#cPrompt').value;body.model=$('#cModel').value;}
  else body.shell=$('#cShell').value;
  const ok=$('#cOutKind').value,out=$('#cOut').value.trim();if(ok&&out)body[ok]=out;
  btn.disabled=true;const old=btn.innerHTML;btn.innerHTML='…создаю';
  let r;try{r=await api('/api/cron/create',{method:'POST',body:JSON.stringify(body)});}catch(e){r={ok:false,out:e.message};}
  btn.disabled=false;btn.innerHTML=old;
  toast(r.ok?('✓ '+(r.out||'задача создана')):('✗ '+r.out));
  if(r.ok)renderCronAdmin();
}
async function deleteCron(id,btn){if(!confirm('Удалить крон-задачу «'+id+'»? Необратимо.'))return;
  btn.disabled=true;let r;try{r=await api('/api/cron/delete',{method:'POST',body:JSON.stringify({id})});}catch(e){r={ok:false,out:e.message};}
  toast(r.ok?('✓ удалено: '+id):('✗ '+r.out));if(r.ok)renderCronAdmin();}

function blogDraftRow(x){const st=x.status==='published'?'ok':x.status==='skipped'?'idle':'warn';

const SLOT_RU={morning:'утро',day:'день',evening:'вечер',situational:'ситуативно',note:'заметки'};

  const kpis=`<div class="kpis">

    <div class="kpi"><div class="k tip" data-tip="Доля чек-инов, успешно записанных в Obsidian.">Записано в Obsidian</div><div class="v ok">${rate}<small>%</small></div></div>
    <div class="kpi"><div class="k tip" data-tip="Не дописанные в Obsidian (очередь outbox). Больше 0 — что-то застряло.">Очередь outbox</div><div class="v ${d.extra.outbox_pending?'warn':''}">${d.extra.outbox_pending||0}</div></div></div>`;

    <div class="barlist">${d.slots.length?d.slots.map(s=>bar((SLOT_RU[s.slot]||s.slot)+' · '+s.done+'✓'+(s.in_progress?' / '+s.in_progress+'…':''),s.done,maxSlot)).join(''):'<div class="empty">Нет данных.</div>'}</div></div>`;
  const tasks=`<div class="panel"><div class="h"><span class="t">Задачи и канал</span></div>
    <div class="kpis" style="padding:var(--sp-3);margin:0">
      <div class="kpi"><div class="k tip" data-tip="Активные задачи в трекере бота (синк с Obsidian/Todoist).">Активных задач</div><div class="v">${d.tasks.active||0}</div></div>

      <div class="kpi"><div class="k tip" data-tip="Сообщений из подключённого Telegram-канала, сохранённых ботом.">Сообщений канала</div><div class="v">${d.extra.channel_messages||0}</div></div>
      <div class="kpi"><div class="k tip" data-tip="Записей в расписании напоминаний/чек-инов.">Расписаний</div><div class="v">${d.extra.schedule||0}</div></div></div></div>`;
  const recent=`<div class="panel"><div class="h"><span class="t">Последние чек-ины</span></div>
    <div class="matlist">${d.recent.length?d.recent.map(r=>`<div class="matrow"><span class="src">${esc(r.date)}</span><span class="ti">${esc(SLOT_RU[r.slot]||r.slot)} · ${esc(r.status)}</span><span class="tm">${r.written?'✓ Obsidian':'—'}</span></div>`).join(''):'<div class="empty">Нет данных.</div>'}</div></div>`;
  $('#content').innerHTML=`<div class="svccap">${icon('i-svc-ok')} Ассистент ведёт чек-ины (утро/день/вечер), задачи и пишет всё в Obsidian. Здесь та же аналитика, что в самом боте: регулярность, разбивка по слотам и состояние очереди записи.</div>`+kpis+`<div class="grid2">${slots}${tasks}</div>`+recent;

    <div class="kpi"><div class="k tip" data-tip="Цель откликов за один прогон задачи (target_applies).">Цель за прогон</div><div class="v">${c.target_applies??'—'}</div></div>
    <div class="kpi"><div class="k tip" data-tip="Сколько страниц выдачи перебирает за прогон (max_pages).">Страниц макс</div><div class="v">${c.max_pages??'—'}</div></div>

    <div class="form" id="hhForm">

        <div class="fld"><label>Где искать <span class="hint-i">search_field · name=в заголовке</span></label><input id="h_search_field" type="text" value="${esc(c.search_field||'')}"></div></div>
      <div class="two"><div class="fld"><label>Регион <span class="hint-i">area · код hh, 113=Россия</span></label><input id="h_area" type="text" value="${esc(c.area||'')}"></div>
        <div class="fld"><label>ID резюме <span class="hint-i">resume_id · какое резюме прикреплять</span></label><input id="h_resume_id" type="text" value="${esc(c.resume_id||'')}"></div></div>
      <div class="two"><div class="fld"><label>Опыт <span class="hint-i">experience · через запятую</span></label><input id="h_experience" type="text" value="${esc(arr(c.experience))}"></div>
        <div class="fld"><label>Формат работы <span class="hint-i">work_format · REMOTE,HYBRID…</span></label><input id="h_work_format" type="text" value="${esc(arr(c.work_format))}"></div></div>
      <div class="fld"><label>Ключевые слова в заголовке <span class="hint-i">title_keywords · через запятую</span></label><input id="h_title_keywords" type="text" value="${esc(arr(c.title_keywords))}"></div>

        <div class="fld"><label>Страниц макс <span class="hint-i">max_pages</span></label><input id="h_max_pages" type="number" value="${c.max_pages??''}"></div></div>

async function saveHh(btn){
  const F=id=>{const e=$('#h_'+id);return e?e.value:'';};
  const body={query:F('query'),search_field:F('search_field'),area:F('area'),resume_id:F('resume_id'),
    experience:F('experience'),work_format:F('work_format'),title_keywords:F('title_keywords'),title_exclude:F('title_exclude'),
    target_applies:F('target_applies'),max_pages:F('max_pages'),window_mode:F('window_mode')};
  btn.disabled=true;const old=btn.innerHTML;btn.innerHTML='…сохраняю';
  let r;try{r=await api('/api/hh/config',{method:'POST',body:JSON.stringify(body)});}catch(e){r={ok:false,out:e.message};}
  btn.disabled=false;btn.innerHTML=old;toast(r.ok?'✓ '+r.out:'✗ '+r.out);
}

/* ════════════════ тема · fx · сворачивание · настройки ════════════════ */
function setTheme(name){
  const root=document.documentElement;
  if(name==='dark')root.removeAttribute('data-theme');else root.setAttribute('data-theme',name);
  root.dataset.themeName=name;
  try{localStorage.setItem('mc-theme',name);}catch(e){}
  buildThemeCards();
  syncOpenGraphTheme();
}
function buildThemeCards(){
  let cur='glass';try{cur=localStorage.getItem('mc-theme')||'glass';}catch(e){}
  const box=$('#setThemes');if(!box)return;
  box.innerHTML=THEMES.map(t=>`<button class="theme-card ${t.id===cur?'on':''}" onclick="setTheme('${t.id}')">
    <span class="sw" style="background:${t.sw}"></span><span class="nm">${esc(t.nm)}</span></button>`).join('');
}
function openSettings(){buildThemeCards();syncFxToggle();$('#setModal').classList.add('on');}
function closeSettings(){$('#setModal').classList.remove('on');}
$('#setModal').addEventListener('click',e=>{if(e.target.id==='setModal')closeSettings();});
function toggleNav(){
  const on=document.querySelector('.app').classList.toggle('nav-collapsed');
  try{localStorage.setItem('mc-nav',on?'1':'0');}catch(e){}
}
function toggleFx(){
  const off=document.body.classList.toggle('no-fx');
  try{localStorage.setItem('mc-fx',off?'0':'1');}catch(e){}
  syncFxToggle();
}
function syncFxToggle(){const t=$('#setFx');if(t)t.classList.toggle('on',!document.body.classList.contains('no-fx'));}
function initChrome(){
  try{if(localStorage.getItem('mc-nav')==='1')document.querySelector('.app').classList.add('nav-collapsed');}catch(e){}
  try{if(localStorage.getItem('mc-fx')==='0')document.body.classList.add('no-fx');}catch(e){}
  buildThemeCards();syncFxToggle();
}

/* ════════════════ старт + поллинг ════════════════ */
initChrome();buildNav();setActive();render();
setInterval(async()=>{
  // сайдбар + пульс обновляются ВСЕГДА (дёшево, маленький DOM) — «живой взгляд» (T14)
  try{const d=await api('/api/state');updateSidebar(d);updatePulse(d.health);
    if(route==='overview')renderOverview();
    else if(route.startsWith('svc:'))renderService(route.slice(4));
    else if(route==='claude'&&ccLeft==='activity')loadList();
  }catch{pulseDown();}
},5000);
