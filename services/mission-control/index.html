<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal OS · Mission Control</title>
<style>
  :root{
    /* ════ общие токены (не зависят от темы) ════ */
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Menlo,Consolas,monospace;
    --fs-pulse:15px; --fs-h:13px; --fs-base:13px; --fs-data:12.5px; --fs-sm:11.5px; --fs-xs:10.5px;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
    --r-1:3px; --r-2:6px; --r-3:8px; --r-pop:10px;
    --bd:1px solid var(--line); --bd-strong:1px solid var(--line-strong);
    --shadow-pop:0 8px 28px rgba(0,0,0,.6); --ring:0 0 0 2px var(--accent-ring);
    --t-fast:120ms; --t-mid:200ms; --t-slow:480ms; --ease:cubic-bezier(.2,.7,.3,1);

    /* ════ ПАЛИТРА · DARK (дефолт) — нейтральный тёмный, спокойный синий акцент ════ */
    --bg:#0e0f12; --surface:#16181d; --surface-2:#1c1f26; --surface-3:#252932; --sunken:#0a0b0e;
    --line:#262a31; --line-2:#1d2027; --line-strong:#363b45; --faint:#4b525d;
    --txt:#e6e8ec; --txt-2:#a2a8b4; --dim:#7c828e;
    --ok:#56b870;       --ok-bg:rgba(86,184,112,.13);
    --degraded:#e0a93a; --degraded-bg:rgba(224,169,58,.14);
    --err:#ef5350;      --err-bg:rgba(239,83,80,.13);  --err-bd:#5c2522; --err-ink:#ff9b97;
    --warn:#e0b13a;     --warn-bg:rgba(224,177,58,.14);
    --idle:#7c828e;     --idle-bg:rgba(124,130,142,.10);
    --info:#5aa9e6;     --info-bg:rgba(90,169,230,.13);
    --accent:#5b9bd5;   --accent-bg:rgba(91,155,213,.13); --accent-ring:rgba(91,155,213,.5);
    --glow:rgba(91,155,213,.32); --scan:rgba(255,255,255,.013);
    --grid:rgba(91,155,213,.038); --bracket:var(--accent);
  }
  /* ════ Tactical · янтарь (ЦУП, sci-fi) ════ */
  [data-theme="tactical"]{
    --bg:#0c0d11; --surface:#15171d; --surface-2:#1b1e26; --surface-3:#23272f; --sunken:#070809;
    --line:#272b33; --line-2:#1e222a; --line-strong:#3b424d; --faint:#4d5562;
    --txt:#ece6d6; --txt-2:#a8a190; --dim:#8c8573;
    --ok:#7fb53e;       --ok-bg:rgba(127,181,62,.13);
    --degraded:#e0902a; --degraded-bg:rgba(224,144,42,.14);
    --err:#ff5b4d;      --err-bg:rgba(255,91,77,.13);  --err-bd:#5c2521; --err-ink:#ff9f96;
    --warn:#e0b13a;     --warn-bg:rgba(224,177,58,.14);
    --idle:#8c8573;     --idle-bg:rgba(140,133,115,.10);
    --info:#5fb0d8;     --info-bg:rgba(95,176,216,.13);
    --accent:#f0a830;   --accent-bg:rgba(240,168,48,.13); --accent-ring:rgba(240,168,48,.5);
    --glow:rgba(240,168,48,.45); --scan:rgba(255,255,255,.018);
    --grid:rgba(240,168,48,.045); --bracket:var(--accent);
  }
  /* ════ HUD-циан (кокпит) ════ */
  [data-theme="hud"]{
    --bg:#070b10; --surface:#0e151d; --surface-2:#132029; --surface-3:#1a2a35; --sunken:#04080c;
    --line:#1c2a35; --line-2:#152029; --line-strong:#2e4451; --faint:#41606f;
    --txt:#e6f3f4; --txt-2:#90b1b9; --dim:#7796a0;
    --ok:#3fd9a0; --ok-bg:rgba(63,217,160,.13);
    --degraded:#e0b13a; --degraded-bg:rgba(224,177,58,.14);
    --err:#ff5b6e; --err-bg:rgba(255,91,110,.13); --err-bd:#5b2230; --err-ink:#ff9aab;
    --warn:#e0b13a; --warn-bg:rgba(224,177,58,.14);
    --idle:#7796a0; --idle-bg:rgba(119,150,160,.10);
    --info:#58a6ff; --info-bg:rgba(88,166,255,.13);
    --accent:#36f0d0; --accent-bg:rgba(54,240,208,.12); --accent-ring:rgba(54,240,208,.5);
    --glow:rgba(54,240,208,.5); --scan:rgba(255,255,255,.02);
    --grid:rgba(54,240,208,.05); --bracket:var(--accent);
  }
  /* ════ Synthwave-неон ════ */
  [data-theme="synth"]{
    --bg:#0d0a18; --surface:#161228; --surface-2:#1d1733; --surface-3:#261d42; --sunken:#08060f;
    --line:#2a2147; --line-2:#1f1838; --line-strong:#43355f; --faint:#5b4a7e;
    --txt:#f1e9ff; --txt-2:#b6a6d6; --dim:#9c8cc0;
    --ok:#46e8a0; --ok-bg:rgba(70,232,160,.13);
    --degraded:#ffb84d; --degraded-bg:rgba(255,184,77,.14);
    --err:#ff5577; --err-bg:rgba(255,85,119,.14); --err-bd:#5b2238; --err-ink:#ff9ab2;
    --warn:#ffb84d; --warn-bg:rgba(255,184,77,.14);
    --idle:#9c8cc0; --idle-bg:rgba(156,140,192,.12);
    --info:#4fd6ff; --info-bg:rgba(79,214,255,.13);
    --accent:#ff5cc8; --accent-bg:rgba(255,92,200,.13); --accent-ring:rgba(255,92,200,.5);
    --glow:rgba(255,92,200,.5); --scan:rgba(255,255,255,.022);
    --grid:rgba(255,92,200,.05); --bracket:var(--accent);
  }
  /* ════ Matrix-фосфор ════ */
  [data-theme="matrix"]{
    --bg:#040806; --surface:#0a120c; --surface-2:#0f1a11; --surface-3:#142217; --sunken:#020503;
    --line:#163018; --line-2:#0f2212; --line-strong:#26482a; --faint:#356b3b;
    --txt:#c8e6cc; --txt-2:#74a87c; --dim:#5f8f66;
    --ok:#36f06a; --ok-bg:rgba(54,240,106,.12);
    --degraded:#d8c63a; --degraded-bg:rgba(216,198,58,.14);
    --err:#ff5b4d; --err-bg:rgba(255,91,77,.14); --err-bd:#5c2521; --err-ink:#ff9f96;
    --warn:#d8c63a; --warn-bg:rgba(216,198,58,.14);
    --idle:#5f8f66; --idle-bg:rgba(95,143,102,.12);
    --info:#4fd6a0; --info-bg:rgba(79,214,160,.13);
    --accent:#36f06a; --accent-bg:rgba(54,240,106,.12); --accent-ring:rgba(54,240,106,.5);
    --glow:rgba(54,240,106,.5); --scan:rgba(54,240,106,.022);
    --grid:rgba(54,240,106,.05); --bracket:var(--accent);
  }
  /* ════ Light · чистый белый (дневной) ════ */
  [data-theme="light"]{
    --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f7f8fa; --surface-3:#eef0f3; --sunken:#e9ebee;
    --line:#e2e5ea; --line-2:#edeff2; --line-strong:#cbd0d8; --faint:#aab0ba;
    --txt:#1c1f24; --txt-2:#525862; --dim:#787e89;
    --ok:#2e8b4f; --ok-bg:rgba(46,139,79,.10);
    --degraded:#b07d12; --degraded-bg:rgba(176,125,18,.12);
    --err:#d23b32; --err-bg:rgba(210,59,50,.10); --err-bd:#e6b3af; --err-ink:#9a2620;
    --warn:#b07d12; --warn-bg:rgba(176,125,18,.12);
    --idle:#787e89; --idle-bg:rgba(120,126,137,.10);
    --info:#2b6cb0; --info-bg:rgba(43,108,176,.10);
    --accent:#2f6fd0; --accent-bg:rgba(47,111,208,.10); --accent-ring:rgba(47,111,208,.4);
    --glow:rgba(47,111,208,.16); --scan:rgba(0,0,0,.01);
    --grid:rgba(47,111,208,.05); --bracket:var(--accent);
    --shadow-pop:0 8px 28px rgba(40,50,70,.18);
  }
  /* ════ Glass · глазоморфизм (редакторский борд: кобальт + матовое стекло) ════ */
  [data-theme="glass"]{
    --display:"Space Grotesk","Archivo","Neue Haas Grotesk Display",var(--ui);
    --serif:"Fraunces","PT Serif",Georgia,serif;
    /* фон почти чёрный по борду; поверхности — полупрозрачное стекло */
    --bg:#0f1012; --sunken:rgba(9,10,12,.55);
    --surface:rgba(23,24,27,.52); --surface-2:rgba(32,34,38,.46); --surface-3:rgba(46,49,56,.55);
    --line:rgba(255,255,255,.085); --line-2:rgba(255,255,255,.05); --line-strong:rgba(255,255,255,.17); --faint:#5b626e;
    --txt:#f4f3f0; --txt-2:#b7bbc3; --dim:#8b8c90;
    --ok:#4fd08a;       --ok-bg:rgba(79,208,138,.14);
    --degraded:#f5b53a; --degraded-bg:rgba(245,181,58,.16);
    --err:#ff6a5e;      --err-bg:rgba(255,106,94,.15); --err-bd:#5c2a26; --err-ink:#ffb0a9;
    --warn:#f5c14a;     --warn-bg:rgba(245,193,74,.15);
    --idle:#8b8c90;     --idle-bg:rgba(139,140,144,.12);
    --info:#5aa0ff;     --info-bg:rgba(90,160,255,.14);
    --accent:#2b5cff;   --accent-bg:rgba(43,92,255,.16); --accent-ring:rgba(43,92,255,.55);
    --glow:rgba(43,92,255,.5); --scan:rgba(255,255,255,.008);
    --grid:rgba(255,255,255,.02); --bracket:var(--accent);
    --shadow-pop:0 16px 48px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:var(--fs-base)/1.45 var(--ui);-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer}
  .mono{font-family:var(--mono)}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px}

  /* ════ sci-fi атмосфера: сетка + сканлайны фоном (Зона 0..N) ════ */
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      linear-gradient(var(--grid) 1px,transparent 1px) 0 0/100% 44px,
      linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/44px 100%;
    -webkit-mask-image:radial-gradient(120% 90% at 50% -10%,#000 30%,transparent 100%);
            mask-image:radial-gradient(120% 90% at 50% -10%,#000 30%,transparent 100%);opacity:.7}
  body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,var(--scan) 0 1px,transparent 1px 3px)}
  body.no-fx::before,body.no-fx::after{display:none}
  .app{position:relative;z-index:1}

  /* угловые скобки-прицел на панелях (диагональ) */
  .bracket{position:relative}
  .bracket::before,.bracket::after{content:"";position:absolute;width:9px;height:9px;
    pointer-events:none;opacity:.55;transition:opacity var(--t-mid)}
  .bracket::before{top:-1px;left:-1px;border-top:1.5px solid var(--bracket);border-left:1.5px solid var(--bracket)}
  .bracket::after{bottom:-1px;right:-1px;border-bottom:1.5px solid var(--bracket);border-right:1.5px solid var(--bracket)}
  .bracket:hover::before,.bracket:hover::after{opacity:1}

  /* свечение акцентов */
  .glow{text-shadow:0 0 10px var(--glow)}

  /* корпусные скобки на пустых углах плиток (kpi/acard/calm) */
  .kpi,.acard,.calm{position:relative}
  .kpi::before,.kpi::after,.acard::before,.acard::after,.calm::before,.calm::after{
    content:"";position:absolute;width:7px;height:7px;pointer-events:none;opacity:.5;z-index:2}
  .kpi::before,.acard::before,.calm::before{top:-1px;right:-1px;
    border-top:1.5px solid var(--bracket);border-right:1.5px solid var(--bracket)}
  .kpi::after,.acard::after,.calm::after{bottom:-1px;left:-1px;
    border-bottom:1.5px solid var(--bracket);border-right:0;
    border-left:1.5px solid var(--bracket)}

  /* инструментальная шапка панели */
  .panel>.h{position:relative;text-transform:uppercase;letter-spacing:.6px;
    background:linear-gradient(180deg,var(--surface-2),transparent)}
  .panel>.h .t{font-family:var(--mono);font-size:12px;color:var(--txt)}
  .panel>.h::before{content:"";width:4px;height:13px;background:var(--accent);
    border-radius:1px;box-shadow:0 0 8px var(--glow);flex:none}
  .panel>.h::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,var(--accent),transparent 38%)}

  /* свечение бренда / активной навигации / LED-точек */
  .brand .mark{box-shadow:0 0 14px var(--glow);text-shadow:0 0 8px var(--glow)}
  .nav a.on{box-shadow:inset 0 0 0 1px var(--line-strong),-2px 0 12px -6px var(--glow)}
  .nav a.on .ic{filter:drop-shadow(0 0 5px var(--glow))}
  .dot.ok,.dot.live{filter:drop-shadow(0 0 4px currentColor)}
  .pulse .verdict .vglyph{filter:drop-shadow(0 0 6px currentColor)}

  /* ════ переключатель тем + fx + сворачивание (в подвале сайдбара) ════ */
  .themebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 8px 4px;margin-top:6px;border-top:var(--bd)}
  .themebar .tlabel{font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);width:100%;font-weight:600}
  .swatch{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-strong);cursor:pointer;
    padding:0;position:relative;transition:transform var(--t-fast)}
  .swatch:hover{transform:scale(1.12)}
  .swatch.on{border-color:var(--txt);box-shadow:0 0 0 2px var(--accent-ring)}
  .swatch[data-t="tactical"]{background:#f0a830} .swatch[data-t="hud"]{background:#36f0d0}
  .swatch[data-t="synth"]{background:#ff5cc8} .swatch[data-t="matrix"]{background:#36f06a}
  .swatch[data-t="light"]{background:linear-gradient(135deg,#f6f4ea 50%,#b8770e 50%)}
  .fxbtn{margin-left:auto;font-family:var(--mono);font-size:var(--fs-xs);color:var(--dim);
    background:transparent;border:var(--bd);border-radius:var(--r-1);padding:2px 7px}
  .fxbtn.on{color:var(--accent);border-color:var(--accent)}
  .collapse-btn{margin-left:auto;width:26px;height:24px;border:var(--bd);border-radius:var(--r-1);
    background:transparent;color:var(--txt-2);display:inline-flex;align-items:center;justify-content:center;flex:none}
  .collapse-btn:hover{color:var(--txt);border-color:var(--line-strong)}
  .collapse-btn .ic{width:14px;height:14px;transition:transform var(--t-mid)}

  /* ручное сворачивание сайдбара (независимо от media-query) */
  .app.nav-collapsed{grid-template-columns:64px 1fr}
  .app.nav-collapsed .side .tx,.app.nav-collapsed .side .lbl,.app.nav-collapsed .side .brand-sub,
  .app.nav-collapsed .side-foot .full,.app.nav-collapsed .nav a .end,
  .app.nav-collapsed .themebar .tlabel,.app.nav-collapsed .themebar .fxbtn,
  .app.nav-collapsed .side-foot .clock{display:none}
  .app.nav-collapsed .brand{justify-content:center;padding-left:0;padding-right:0;gap:0}
  .app.nav-collapsed .nav a{justify-content:center;padding-left:0;padding-right:0}
  .app.nav-collapsed .themebar{justify-content:center;padding-left:0;padding-right:0}
  .app.nav-collapsed .collapse-btn .ic{transform:rotate(180deg)}
  .app.nav-collapsed .side-foot .fr{justify-content:center}
  .app.nav-collapsed .side-foot .pid{display:none}
  .app.nav-collapsed .side-foot{padding-left:6px;padding-right:6px}
  .app.nav-collapsed .side-foot .btn{padding-left:0;padding-right:0}

  /* ════ Граф · полноэкранная сцена с наложенной телеметрией ════ */
  #content.wide{max-width:none;padding:0}
  .gstage{position:relative;width:100%;height:calc(100vh - 96px);background:var(--sunken);
    overflow:hidden;border-top:var(--bd)}
  .gstage:fullscreen{height:100vh;width:100vw}
  .gstage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  .gstage .gph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--txt-2)}
  .goverlay{position:absolute;top:14px;right:14px;z-index:3;width:248px;
    background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(8px);
    border:var(--bd-strong);border-radius:var(--r-3);box-shadow:var(--shadow-pop);overflow:hidden}
  .goverlay .oh{display:flex;align-items:center;gap:7px;padding:8px 11px;border-bottom:1px solid var(--line-2);
    font-family:var(--mono);font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.6px;color:var(--accent)}
  .goverlay .oh .sp{flex:1} .goverlay .ob{padding:6px 11px 10px;display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .goverlay.min .ob{display:none}
  .ometric{min-width:0}.ometric .k{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
  .ometric .v{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--txt);letter-spacing:-.3px}
  .ometric .v small{font-size:10px;color:var(--dim)}
  .gctrls{position:absolute;top:14px;left:14px;z-index:3;display:flex;gap:6px;flex-wrap:wrap;max-width:60%}
  .ghint{margin-left:auto}
  .icon-btn{background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(8px)}

  /* 1 ── layout ── */
  .app{display:grid;grid-template-columns:248px 1fr;height:100vh}
  @media(max-width:1100px){.app{grid-template-columns:60px 1fr}
    .side .tx,.side .lbl,.side .brand-sub,.side-foot .full,
    .themebar .tlabel,.themebar .fxbtn,.nav a .end{display:none}
    .brand{justify-content:center;gap:0} .nav a{justify-content:center}
    .themebar{justify-content:center;padding-left:0;padding-right:0}}

  /* ── sidebar ── */
  .side{background:var(--surface);border-right:var(--bd);display:flex;flex-direction:column;padding:var(--sp-3) var(--sp-2)}
  .brand{display:flex;align-items:center;gap:var(--sp-2);padding:6px var(--sp-2) var(--sp-4)}
  .brand .mark{display:inline-flex;align-items:center;justify-content:center;width:30px;height:26px;
    border:var(--bd-strong);border-radius:var(--r-2);font-family:var(--mono);font-weight:700;font-size:12px;
    color:var(--accent);letter-spacing:.5px;flex:none}
  .brand b{font-size:13px;font-weight:650;letter-spacing:-.2px;display:block}
  .brand .brand-sub{font-size:10.5px;color:var(--dim)}
  .nav{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
  .nav .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);padding:14px 10px 5px;font-weight:600}
  .nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--r-2);color:var(--txt-2);
    cursor:pointer;font-size:13px;font-weight:500;text-decoration:none;border-left:2px solid transparent}
  .nav a:hover{background:var(--surface-2);color:var(--txt)}
  .nav a.on{background:var(--surface-3);color:var(--txt);font-weight:600;border-left-color:var(--accent)}
  .nav a .ic{width:16px;height:16px;flex:none;opacity:.9}
  .nav a .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav a .end{margin-left:auto;display:flex;align-items:center;gap:6px}
  .nav-badge{font-family:var(--mono);font-size:var(--fs-xs);font-weight:700;color:var(--bg);
    background:var(--degraded);border-radius:var(--r-1);padding:1px 5px}
  .nav-badge.err{background:var(--err)}
  .nav-live{font-family:var(--mono);font-size:var(--fs-xs);color:var(--accent)}
  .side-foot{border-top:var(--bd);padding:10px 10px 2px;margin-top:8px;font-size:var(--fs-sm);color:var(--txt-2)}
  .side-foot .fr{display:flex;align-items:center;gap:7px;margin-top:5px}
  .side-foot .clock{font-family:var(--mono);color:var(--dim);margin-left:auto}
  .side-foot .pid{font-family:var(--mono);color:var(--txt);font-weight:600}

  /* ── status dot (форма-дубль) ── */
  .dot{font-family:var(--mono);font-size:11px;line-height:1;flex:none}
  .dot.ok{color:var(--ok)} .dot.degraded{color:var(--degraded)} .dot.err{color:var(--err)}
  .dot.idle{color:var(--idle)} .dot.wait{color:var(--info)} .dot.warn{color:var(--warn)}
  .dot.unknown{color:var(--dim)}
  .dot.live{animation:breathe var(--t-slow) ease-in-out infinite alternate}
  @keyframes breathe{from{opacity:.5}to{opacity:1}}

  /* ── chip ── */
  .chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:var(--fs-xs);
    font-weight:600;padding:2px 7px;border-radius:var(--r-1);white-space:nowrap}
  .chip.ok{color:var(--ok);background:var(--ok-bg)} .chip.degraded{color:var(--degraded);background:var(--degraded-bg)}
  .chip.err{color:var(--err);background:var(--err-bg)} .chip.idle{color:var(--idle);background:var(--idle-bg)}
  .chip.warn{color:var(--warn);background:var(--warn-bg)} .chip.wait{color:var(--info);background:var(--info-bg)}
  .chip.unknown{color:var(--dim);background:var(--idle-bg)}

  /* ── main ── */
  .main{overflow:auto;display:flex;flex-direction:column}
  /* 2 ── pulse (Зона 0) ── */
  .pulse{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:var(--sp-4);
    height:48px;padding:0 var(--sp-5);background:var(--surface);border-bottom:var(--bd);
    border-top:3px solid var(--idle)}                 /* P4: цветная шторка по overall */
  .pulse.ok{border-top-color:var(--ok)}
  .pulse.degraded{border-top-color:var(--degraded)}
  .pulse.err{border-top-color:var(--err)}
  .pulse .verdict{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-pulse);font-weight:600}
  .pulse .verdict .vglyph{font-family:var(--mono);font-size:19px;line-height:1} /* P4: крупный глиф */
  .pulse.ok .verdict{color:var(--ok)} .pulse.degraded .verdict{color:var(--degraded)} .pulse.err .verdict{color:var(--err)}
  .pulse .att{font-family:var(--mono);font-size:var(--fs-data);color:var(--degraded)}
  .pulse .att.err{color:var(--err)}
  .pulse .up{font-family:var(--mono);font-size:var(--fs-data);color:var(--txt-2)}
  .pulse .sp{flex:1}
  .pulse .clock{font-family:var(--mono);color:var(--txt-2);font-size:var(--fs-data)}

  .topbar{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4) var(--sp-5) var(--sp-2)}
  .topbar h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.2px}
  .topbar .crumb{font-size:var(--fs-sm);color:var(--dim);font-family:var(--mono)}
  .topbar .sp{flex:1}
  .content{padding:var(--sp-2) var(--sp-5) var(--sp-6);max-width:1240px}
  .svccap{display:flex;align-items:flex-start;gap:8px;background:var(--surface-2);border:var(--bd);
    border-left:2px solid var(--accent);border-radius:var(--r-2);padding:9px 12px;margin-bottom:var(--sp-4);
    color:var(--txt-2);font-size:var(--fs-sm);line-height:1.5}
  .svccap .ic{width:14px;height:14px;flex:none;margin-top:2px;color:var(--accent);opacity:.9}

  /* 3 ── panel / row ── */
  .panel{background:var(--surface);border:var(--bd);border-radius:var(--r-3);margin-bottom:var(--sp-4);overflow:hidden}
  .panel>.h{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3);border-bottom:1px solid var(--line-2)}
  .panel>.h .ic{width:15px;height:15px;flex:none;color:var(--accent)}
  .panel>.h .t{font-size:var(--fs-h);font-weight:650} .panel>.h .sp{flex:1}
  .panel>.h .badge{font-family:var(--mono);font-size:var(--fs-sm);color:var(--dim)}
  .grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:var(--sp-4)}
  @media(max-width:980px){.grid2{grid-template-columns:1fr}}

  .row{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--line-2)}
  .row:last-child{border-bottom:0} .row:hover{background:var(--surface-2)}
  .row .meta{min-width:0;flex:1}
  .row .name{display:flex;align-items:center;gap:7px;font-size:var(--fs-base)}
  .row .id{font-family:var(--mono);font-weight:600;font-size:var(--fs-data)}
  .row .desc{color:var(--txt-2);font-size:var(--fs-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
  .row .when{font-family:var(--mono);font-size:var(--fs-xs);color:var(--dim);text-align:right;white-space:nowrap;line-height:1.5}
  .row .when b{color:var(--txt-2);font-weight:600}
  .row.alert{border-left:2px solid var(--err)} .row.warn{border-left:2px solid var(--warn)}
  .row.off{opacity:.6}
  .acts{display:flex;gap:var(--sp-1);flex:none;flex-wrap:wrap;justify-content:flex-end}

  /* svc compact strip ── */
  .svcrow{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center;
    padding:var(--sp-3);background:var(--surface);border:var(--bd);border-radius:var(--r-3);margin-bottom:var(--sp-4)}
  .svcrow .lab{font-family:var(--mono);font-size:var(--fs-sm);color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  .svcchip{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);cursor:pointer;
    padding:3px 8px;border-radius:var(--r-1)} .svcchip:hover{background:var(--surface-2)}
  .svcchip .id{font-family:var(--mono);font-weight:600}
  .svcchip .ut{font-family:var(--mono);font-size:var(--fs-xs);color:var(--dim)}

  /* 5 ── kpi ── */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--sp-2);margin-bottom:var(--sp-4)}
  .kpi{background:var(--surface-2);border:var(--bd);border-radius:var(--r-2);padding:var(--sp-3);min-width:0}
  .kpi .k{font-size:var(--fs-xs);color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  .kpi .v{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:4px;letter-spacing:-.3px}
  .kpi .v small{font-size:12px;color:var(--dim);font-weight:500}
  .kpi .v.err{color:var(--err)} .kpi .v.ok{color:var(--ok)} .kpi .v.warn{color:var(--warn)}
  .kpi .ctx{font-family:var(--mono);font-size:var(--fs-xs);margin-top:3px;color:var(--txt-2)}
  .kpi.attn{border-left:2px solid var(--warn)}

  /* 6 ── attention zone ── */
  .attention{margin-bottom:var(--sp-4)}
  .attention>.h{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) 2px var(--sp-3);
    font-size:var(--fs-h);font-weight:650;color:var(--txt);text-transform:uppercase;letter-spacing:.5px}
  .attention>.h .ic{width:16px;height:16px;color:var(--degraded)}
  .attention>.h .n{font-family:var(--mono);color:var(--degraded)}
  .attention>.h .n.err{color:var(--err)}
  .acard{background:var(--surface-2);border:var(--bd);border-radius:var(--r-2);
    border-left:2px solid var(--warn);padding:var(--sp-3);margin-bottom:var(--sp-2)}
  .acard.err{border-left-color:var(--err)} .acard.info{border-left-color:var(--info)}
  .acard .top{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-data);flex-wrap:wrap}
  .acard .top .id{font-family:var(--mono);font-weight:600;color:var(--txt)}
  .acard .reason{color:var(--txt);font-size:var(--fs-data);margin:6px 0 4px;font-family:var(--mono)}
  .acard .ahint{display:flex;align-items:flex-start;gap:6px;color:var(--txt-2);font-size:var(--fs-sm);
    line-height:1.5;margin:0 0 var(--sp-2)}
  .acard .ahint .ic{width:13px;height:13px;flex:none;margin-top:2px;color:var(--dim);opacity:.8}
  .acard .acts{justify-content:flex-start}
  .calm{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3);background:var(--surface);border:var(--bd);
    border-left:2px solid var(--ok);border-radius:var(--r-3);color:var(--ok);font-size:var(--fs-base);margin-bottom:var(--sp-4)}
  .calm .ic{width:15px;height:15px}

  /* 7 ── buttons ── */
  .btn{display:inline-flex;align-items:center;gap:5px;border:var(--bd);background:transparent;color:var(--txt-2);
    padding:6px 10px;border-radius:var(--r-2);font:600 var(--fs-sm)/1 var(--ui);cursor:pointer;transition:var(--t-fast)}
  .btn:hover{border-color:var(--line-strong);color:var(--txt);background:var(--surface-2)}
  .btn:active{transform:translateY(1px)} .btn:disabled{opacity:.4;cursor:default}
  .btn.sm{padding:6px 10px;font-size:var(--fs-sm);min-height:28px}
  .btn.primary{color:var(--accent);border-color:var(--accent)} .btn.primary:hover{background:var(--accent-bg)}
  .btn.danger{color:var(--err)} .btn.danger:hover{border-color:var(--err);background:var(--err-bg)}
  .btn .ic{width:13px;height:13px}
  .btn:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible,
  .svcchip:focus-visible,.nav a:focus-visible{outline:none;box-shadow:var(--ring);border-color:var(--accent)}

  /* 8 ── feed / errpre / logbox / empty ── */
  .feed{overflow:auto;max-height:460px}
  .ev{display:flex;gap:var(--sp-2);align-items:baseline;
    padding:6px var(--sp-3);border-bottom:1px solid var(--line-2);font-family:var(--mono);font-size:var(--fs-xs)}
  .ev:last-child{border-bottom:0}
  .ev .t{color:var(--dim);white-space:nowrap} .ev .j{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev.err{border-left:2px solid var(--err)}
  .errpre{background:var(--sunken);color:var(--err-ink);border:1px solid var(--err-bd);border-left:2px solid var(--err);
    border-radius:var(--r-2);padding:var(--sp-2) var(--sp-3);font-family:var(--mono);font-size:var(--fs-xs);
    line-height:1.55;white-space:pre-wrap;max-height:180px;overflow:auto;margin-top:var(--sp-2)}
  .logbox{background:var(--sunken);color:var(--txt);font-family:var(--mono);font-size:var(--fs-xs);
    line-height:1.55;padding:var(--sp-3);max-height:320px;overflow:auto;white-space:pre-wrap}
  details>summary{cursor:pointer;padding:var(--sp-3);font-size:var(--fs-base);font-weight:600;color:var(--txt-2);list-style:none}
  details>summary::-webkit-details-marker{display:none}
  details>summary::before{content:'▸ ';color:var(--dim)} details[open]>summary::before{content:'▾ '}
  .empty{padding:var(--sp-6) var(--sp-4);text-align:center;color:var(--txt-2);font-size:var(--fs-sm);line-height:1.6}
  .empty .act-line{margin-top:var(--sp-3)}

  /* flash on change (T14/§7) */
  .flash{animation:flash var(--t-mid) var(--ease)}
  @keyframes flash{from{background:var(--surface-3)}to{background:transparent}}

  /* ── claude code ── */
  .cc{display:grid;grid-template-columns:270px 1fr;gap:var(--sp-4);height:calc(100vh - 150px);min-height:460px}
  @media(max-width:880px){.cc{grid-template-columns:1fr;height:auto}}
  .cc-side{display:flex;flex-direction:column;overflow:hidden}
  .seg{display:flex;gap:3px;padding:6px;border-bottom:1px solid var(--line-2)}
  .seg button{flex:1;border:0;background:transparent;color:var(--txt-2);padding:7px;border-radius:var(--r-2);font-size:var(--fs-sm);font-weight:600}
  .seg button.on{background:var(--surface-3);color:var(--accent)}
  .cc-list{overflow:auto;flex:1}
  .sess{padding:10px var(--sp-3);border-bottom:1px solid var(--line-2);cursor:pointer}
  .sess:hover{background:var(--surface-2)} .sess.on{background:var(--surface-3)}
  .sess .st{font-family:var(--mono);color:var(--dim);font-size:var(--fs-xs);display:flex;gap:6px}
  .sess .sx{font-size:var(--fs-sm);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
  .act{padding:9px var(--sp-3);border-bottom:1px solid var(--line-2);font-size:var(--fs-sm)}
  .act .ah{display:flex;gap:7px;align-items:center;color:var(--dim);font-family:var(--mono);font-size:var(--fs-xs)}
  .act .ap{margin-top:3px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .act .ar{margin-top:2px;color:var(--txt-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:var(--fs-xs)}

  .cc-main{display:flex;flex-direction:column;overflow:hidden}
  .transcript{flex:1;overflow:auto;padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3);background:var(--sunken)}
  .hint{color:var(--txt-2);font-size:var(--fs-base);line-height:1.6;max-width:560px;margin:auto;text-align:center}
  .msg{max-width:84%}
  .msg.u{align-self:flex-end}
  .msg.u .b{background:var(--surface-3);border:var(--bd-strong);color:var(--txt);border-radius:var(--r-2);padding:9px 13px;font-size:var(--fs-base);white-space:pre-wrap}
  .msg.a .b{background:var(--surface-2);border:var(--bd);color:var(--txt);border-radius:var(--r-2);padding:10px 14px;font-size:var(--fs-base);line-height:1.62;white-space:pre-wrap}
  .tool{align-self:flex-start;font-family:var(--mono);font-size:var(--fs-xs);color:var(--accent);background:var(--surface-2);
    border:var(--bd);border-radius:var(--r-2);padding:5px 10px;max-width:86%}
  .tool .ti{color:var(--txt-2)} .tool.res{color:var(--txt-2)}
  .final{align-self:center;font-family:var(--mono);font-size:var(--fs-xs);color:var(--dim);padding:4px}
  .cerr{align-self:stretch;background:var(--sunken);border:1px solid var(--err-bd);color:var(--err-ink);border-radius:var(--r-2);padding:9px 13px;font-size:var(--fs-sm);white-space:pre-wrap;font-family:var(--mono)}
  .typing{display:inline-block;width:7px;height:14px;background:var(--accent);animation:blink 1s steps(2) infinite;vertical-align:-2px;border-radius:1px}
  @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
  .composer{border-top:1px solid var(--line-2);padding:var(--sp-3);background:var(--surface)}
  .ctrls{display:flex;gap:var(--sp-2);margin-bottom:var(--sp-2);align-items:center}
  .ctrls select{background:var(--surface-2);color:var(--txt);border:var(--bd);border-radius:var(--r-2);padding:6px 9px;font:inherit;font-size:var(--fs-sm);font-weight:500}
  .ctrls .cwd{margin-left:auto;font-family:var(--mono);font-size:var(--fs-xs);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
  .inrow{display:flex;gap:var(--sp-2);align-items:flex-end}
  .inrow textarea{flex:1;background:var(--surface-2);color:var(--txt);border:var(--bd);border-radius:var(--r-2);padding:10px 12px;font:inherit;font-size:var(--fs-base);resize:vertical;max-height:200px}
  .send{width:44px;height:42px;border-radius:var(--r-2);border:1px solid var(--accent);background:transparent;color:var(--accent);flex:none;display:inline-flex;align-items:center;justify-content:center}
  .send:hover{background:var(--accent-bg)} .send:disabled{opacity:.4}
  .send .ic{width:16px;height:16px}
  .perm-full{color:var(--degraded)!important;border-color:var(--degraded)!important}
  .perm-tag{font-family:var(--mono);font-size:var(--fs-xs);color:var(--degraded);margin-left:2px}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--surface-3);color:var(--txt);
    border:var(--bd-strong);padding:10px 18px;border-radius:var(--r-2);font-size:var(--fs-base);opacity:0;transition:var(--t-mid);
    pointer-events:none;z-index:30;box-shadow:var(--shadow-pop)}
  .toast.on{opacity:1}
  .modal{position:fixed;inset:0;background:rgba(3,6,10,.6);display:none;align-items:center;justify-content:center;z-index:25}
  .modal.on{display:flex}
  .modal .box{background:var(--surface);border:var(--bd-strong);border-radius:var(--r-pop);width:min(840px,92vw);max-height:82vh;display:flex;flex-direction:column;box-shadow:var(--shadow-pop)}
  .modal .mh{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--line-2);font-weight:650;display:flex;font-family:var(--mono);font-size:var(--fs-data)}
  .modal .x{margin-left:auto;cursor:pointer;color:var(--dim);background:none;border:0}

  /* ── tooltip-подсказки (data-tip) — что значит метрика ── */
  .tip{position:relative;cursor:help;border-bottom:1px dotted var(--faint)}
  .tip::after{content:attr(data-tip);position:absolute;left:0;bottom:calc(100% + 6px);z-index:40;
    width:max-content;max-width:260px;background:var(--surface-3);color:var(--txt);border:var(--bd-strong);
    border-radius:var(--r-2);box-shadow:var(--shadow-pop);padding:7px 10px;font:500 var(--fs-sm)/1.45 var(--ui);
    text-transform:none;letter-spacing:0;white-space:normal;opacity:0;visibility:hidden;
    transform:translateY(3px);transition:opacity var(--t-fast),transform var(--t-fast);pointer-events:none}
  .tip:hover::after,.tip:focus-visible::after{opacity:1;visibility:visible;transform:translateY(0)}
  .kpi .k.tip,.ometric .k.tip{display:inline-block}

  /* ── settings modal ── */
  .set-grid{display:flex;flex-direction:column;gap:var(--sp-5);padding:var(--sp-4)}
  .set-sec>.lbl{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.7px;color:var(--dim);
    font-weight:600;margin-bottom:var(--sp-3)}
  .themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:var(--sp-2)}
  .theme-card{display:flex;align-items:center;gap:8px;padding:8px 10px;border:var(--bd);border-radius:var(--r-2);
    background:var(--surface-2);cursor:pointer;text-align:left;color:var(--txt-2);transition:var(--t-fast)}
  .theme-card:hover{border-color:var(--line-strong);color:var(--txt)}
  .theme-card.on{border-color:var(--accent);color:var(--txt);box-shadow:inset 0 0 0 1px var(--accent)}
  .theme-card .sw{width:22px;height:22px;border-radius:6px;border:1px solid var(--line-strong);flex:none}
  .theme-card .nm{font-size:var(--fs-sm);font-weight:600}
  .set-row{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) 0}
  .set-row .sp{flex:1}
  .toggle{width:42px;height:24px;border-radius:12px;border:var(--bd-strong);background:var(--surface-2);
    position:relative;flex:none;transition:var(--t-fast)}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
    background:var(--faint);transition:var(--t-fast)}
  .toggle.on{background:var(--accent-bg);border-color:var(--accent)}
  .toggle.on::after{left:21px;background:var(--accent)}

  /* ── admin / builder forms ── */
  .form{display:grid;gap:var(--sp-3);padding:var(--sp-4)}
  .form .fld{display:flex;flex-direction:column;gap:4px}
  .form .fld>label{font-size:var(--fs-sm);font-weight:600;color:var(--txt-2);display:flex;align-items:center;gap:6px}
  .form .fld>label .hint-i{font-size:var(--fs-xs);color:var(--dim);font-weight:500}
  .form input[type=text],.form input[type=number],.form textarea,.form select{
    background:var(--surface-2);color:var(--txt);border:var(--bd);border-radius:var(--r-2);
    padding:8px 11px;font:inherit;font-size:var(--fs-base);width:100%}
  .form textarea{resize:vertical;min-height:60px;font-family:var(--mono);font-size:var(--fs-data)}
  .form .two{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
  @media(max-width:680px){.form .two{grid-template-columns:1fr}}
  .form .seg{border:var(--bd);border-radius:var(--r-2);padding:3px;width:max-content}
  .form .seg button{border:0;background:transparent;color:var(--txt-2);padding:6px 14px;border-radius:var(--r-1);font-weight:600;font-size:var(--fs-sm)}
  .form .seg button.on{background:var(--surface-3);color:var(--accent)}
  .form .actions{display:flex;gap:var(--sp-2);align-items:center;margin-top:var(--sp-1)}
  .barlist{display:flex;flex-direction:column;gap:6px;padding:var(--sp-3)}
  .barrow{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm)}
  .barrow .nm{min-width:120px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt-2)}
  .barrow .track{flex:1;height:8px;background:var(--surface-3);border-radius:4px;overflow:hidden}
  .barrow .fill{height:100%;background:var(--accent);border-radius:4px}
  .barrow .n{font-family:var(--mono);font-size:var(--fs-xs);color:var(--txt);min-width:34px;text-align:right}
  .matlist{max-height:520px;overflow:auto}
  .matrow{display:flex;gap:var(--sp-2);align-items:baseline;padding:7px var(--sp-3);border-bottom:1px solid var(--line-2)}
  .matrow:last-child{border-bottom:0} .matrow:hover{background:var(--surface-2)}
  .matrow .src{font-family:var(--mono);font-size:var(--fs-xs);color:var(--accent);min-width:120px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .matrow .ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt)}
  .matrow .tm{font-family:var(--mono);font-size:var(--fs-xs);color:var(--dim);flex:none}
  .matrow a{color:inherit;text-decoration:none} .matrow a:hover .ti{color:var(--accent)}
  .pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:var(--fs-xs);
    padding:1px 7px;border-radius:var(--r-1);background:var(--surface-3);color:var(--txt-2)}
  .clickrow{cursor:pointer} .clickrow:hover{background:var(--surface-2)}

  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

  /* ════════════════════════════════════════════════════════════════════
     UX v2 · КОМАНДНЫЙ ПУЛЬТ — статус в одну полосу, задачи крупными
     карточками, крупные всегда-видимые кнопки, лента сбоку/сворачив.
     ════════════════════════════════════════════════════════════════════ */
  /* одна тонкая полоса статуса (сервисы + метрики пульта + вход в Claude) */
  .statusbar{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;
    padding:9px 14px;background:var(--surface);border:var(--bd);border-radius:var(--r-3);margin-bottom:var(--sp-4)}
  .statusbar .sb-left{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
  .statusbar .sb-right{display:flex;align-items:center;gap:10px 14px;margin-left:auto;flex-wrap:wrap}
  .sb-lab{font-family:var(--mono);font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
  .sdot{display:inline-flex;align-items:center;gap:5px;background:transparent;border:0;color:var(--txt-2);
    font-size:var(--fs-sm);padding:3px 7px;border-radius:var(--r-1);cursor:pointer;transition:var(--t-fast)}
  .sdot:hover{background:var(--surface-2);color:var(--txt)}
  .sdot .dot{font-family:var(--mono);font-size:10px;filter:drop-shadow(0 0 4px currentColor)}
  .sdot.ok .dot{color:var(--ok)} .sdot.warn .dot{color:var(--warn)} .sdot.err .dot{color:var(--err)}
  .sb-ok{color:var(--ok);font-size:var(--fs-sm);font-weight:600}
  .sb-alert{color:var(--degraded);font-size:var(--fs-sm);font-weight:700}
  .sb-metric{font-family:var(--mono);font-size:var(--fs-sm);color:var(--txt-2);white-space:nowrap}
  .sb-metric b{color:var(--txt);font-weight:700}
  .sb-sep{width:1px;height:18px;background:var(--line-strong);flex:none}

  /* операционная сетка: задачи (шире) · лента (уже, сворачивается) */
  .opsgrid{display:grid;grid-template-columns:minmax(0,1.95fr) minmax(250px,.85fr);gap:var(--sp-4);align-items:start}
  .opsgrid.nofeed{grid-template-columns:1fr}
  .opsgrid.nofeed .feedcol{display:none}
  @media(max-width:920px){.opsgrid{grid-template-columns:1fr}.opsgrid .feedcol{display:none}}
  .opscol{min-width:0}
  .colhead{display:flex;align-items:center;gap:10px;margin-bottom:var(--sp-3);padding:0 2px}
  .colhead .t{font-size:var(--fs-h);font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--txt)}
  .colhead .badge{font-family:var(--mono);font-size:var(--fs-xs);color:var(--dim)}
  .feedtoggle{margin-left:auto;font-family:var(--mono);font-size:var(--fs-xs);color:var(--txt-2);
    background:transparent;border:var(--bd);border-radius:var(--r-1);padding:3px 10px;cursor:pointer}
  .feedtoggle:hover{color:var(--txt);border-color:var(--line-strong)}

  /* крупная карточка крон-задачи */
  .jobgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:var(--sp-3)}
  .jobcard{background:var(--surface);border:var(--bd);border-radius:var(--r-3);padding:14px 15px 13px;
    display:flex;flex-direction:column;gap:9px;transition:border-color var(--t-fast),box-shadow var(--t-fast)}
  .jobcard:hover{border-color:var(--line-strong)}
  .jobcard.alert{border-left:3px solid var(--err)} .jobcard.warn{border-left:3px solid var(--warn)}
  .jobcard.off{opacity:.6}
  .jc-head{display:flex;align-items:center;gap:8px;min-width:0}
  .jc-head .dot{font-size:11px;filter:drop-shadow(0 0 4px currentColor)}
  .jc-name{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--txt);letter-spacing:-.2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .jc-head .sp{flex:1}
  .jc-desc{color:var(--txt-2);font-size:var(--fs-sm);line-height:1.45;min-height:2.9em;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .jc-meta{display:flex;flex-wrap:wrap;gap:3px 12px;font-family:var(--mono);font-size:var(--fs-xs);color:var(--dim)}
  .jc-meta .sched{color:var(--accent);font-weight:600}
  .jc-meta b{color:var(--txt-2);font-weight:600}
  .jc-acts{display:flex;align-items:center;gap:7px;margin-top:3px;padding-top:10px;border-top:1px solid var(--line-2)}
  .jc-acts .sp{flex:1}
  .jc-acts .errbtn{color:var(--err);border-color:var(--err-bd)}

  /* крупные кнопки (всегда видимы) */
  .btn.big{padding:8px 13px;font-size:var(--fs-base);min-height:34px;border-radius:var(--r-2)}
  .btn.big .ic{width:15px;height:15px}
  .errpre{margin-top:6px}

  /* лента — вторичная, компактная */
  .feedcol .feed{border:var(--bd);border-radius:var(--r-3);background:var(--surface);
    max-height:calc(100vh - 230px);padding:2px 0}
  .feedcol .ev{padding:6px 12px}

  /* ════════════════════════════════════════════════════════════════════
     GLASS · глазоморфизм — редакторская подача борда + матовое стекло.
     Всё скоупится в [data-theme="glass"], остальные темы не трогаются.
     ════════════════════════════════════════════════════════════════════ */
  /* фон: aurora-блобы (кобальт + тёплый уголёк), чтобы блюр стекла читался */
  [data-theme="glass"] body::before{
    background:
      radial-gradient(46% 40% at 18% 8%, rgba(43,92,255,.28), transparent 62%),
      radial-gradient(40% 46% at 88% 14%, rgba(58,160,255,.16), transparent 60%),
      radial-gradient(52% 50% at 78% 96%, rgba(43,92,255,.20), transparent 62%),
      radial-gradient(38% 42% at 6% 92%, rgba(255,90,77,.10), transparent 60%);
    -webkit-mask-image:none; mask-image:none; opacity:1;
    animation:auroraDrift 26s ease-in-out infinite alternate;
  }
  [data-theme="glass"] body::after{
    background:radial-gradient(120% 90% at 50% -8%, transparent 40%, rgba(9,10,12,.55) 100%);
  }
  [data-theme="glass"].no-fx body::before{animation:none}
  @keyframes auroraDrift{
    from{transform:translate3d(-1.5%,-1%,0) scale(1.02)}
    to{transform:translate3d(2%,1.5%,0) scale(1.06)}
  }

  /* базовое стекло: полупрозрачный фон + блюр + верхний блик-кромка */
  [data-theme="glass"] .side,
  [data-theme="glass"] .panel,
  [data-theme="glass"] .statusbar,
  [data-theme="glass"] .jobcard,
  [data-theme="glass"] .feedcol .feed,
  [data-theme="glass"] .pulse,
  [data-theme="glass"] .svcrow,
  [data-theme="glass"] .svccap,
  [data-theme="glass"] .kpi,
  [data-theme="glass"] .acard,
  [data-theme="glass"] .calm,
  [data-theme="glass"] .box,
  [data-theme="glass"] .bcard,
  [data-theme="glass"] .addbox,
  [data-theme="glass"] .dnabox,
  [data-theme="glass"] .composer,
  [data-theme="glass"] .toast,
  [data-theme="glass"] .goverlay{
    -webkit-backdrop-filter:blur(22px) saturate(1.35);
            backdrop-filter:blur(22px) saturate(1.35);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.09), 0 10px 34px -18px rgba(0,0,0,.7);
  }
  [data-theme="glass"] .panel,
  [data-theme="glass"] .box,
  [data-theme="glass"] .bcard{border-radius:14px}
  [data-theme="glass"] .kpi,[data-theme="glass"] .acard{border-radius:12px}

  /* сайдбар — вертикальная стеклянная колонна */
  [data-theme="glass"] .side{
    background:linear-gradient(180deg, rgba(23,24,27,.62), rgba(16,17,20,.5));
    border-right:1px solid rgba(255,255,255,.07);
    box-shadow:inset -1px 0 0 rgba(255,255,255,.04), 8px 0 40px -30px #000;
  }
  /* pulse-шапка: липкое стекло поверх скролла */
  [data-theme="glass"] .pulse{
    background:linear-gradient(180deg, rgba(23,24,27,.72), rgba(23,24,27,.5));
    border-bottom:1px solid rgba(255,255,255,.08);
  }

  /* акцент навигации — стеклянная кобальтовая плашка */
  [data-theme="glass"] .nav a.on{
    background:linear-gradient(90deg, rgba(43,92,255,.20), rgba(43,92,255,.06));
    box-shadow:inset 0 0 0 1px rgba(43,92,255,.35), -6px 0 22px -10px var(--glow);
  }
  [data-theme="glass"] .nav a:hover{background:rgba(255,255,255,.05)}

  /* редакторская типографика: крупные уверенные числа-герои */
  [data-theme="glass"] .kpi .v,
  [data-theme="glass"] .ometric .v{
    font-family:var(--display); font-weight:600; letter-spacing:-.6px;
    font-variant-numeric:tabular-nums;
  }
  [data-theme="glass"] .kpi .v{font-size:26px}
  [data-theme="glass"] .kpi .k,
  [data-theme="glass"] .panel>.h .t,
  [data-theme="glass"] .attention>.h,
  [data-theme="glass"] .svcrow .lab{letter-spacing:.9px}
  /* бренд: гротеск-дисплей + один засечный курсив-акцент (по борду) */
  [data-theme="glass"] .brand b{font-family:var(--display);font-weight:700;letter-spacing:-.3px}
  [data-theme="glass"] .brand .brand-sub{font-family:var(--serif);font-style:italic;letter-spacing:.1px}
  [data-theme="glass"] .brand .mark{
    background:linear-gradient(135deg, rgba(43,92,255,.22), rgba(43,92,255,.04));
    box-shadow:inset 0 0 0 1px rgba(43,92,255,.4), 0 0 18px -4px var(--glow);
  }

  /* кнопки и чипы — лёгкое стекло */
  [data-theme="glass"] .jobcard{border-radius:14px}
  [data-theme="glass"] .jobcard:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 14px 40px -20px var(--glow)}
  [data-theme="glass"] .btn.primary{
    background:linear-gradient(180deg, rgba(43,92,255,.30), rgba(43,92,255,.14));
    border-color:rgba(43,92,255,.55);color:#eaf0ff;
    box-shadow:0 4px 16px -6px var(--glow), inset 0 1px 0 rgba(255,255,255,.14)}
  [data-theme="glass"] .btn.primary:hover{background:linear-gradient(180deg, rgba(43,92,255,.42), rgba(43,92,255,.2))}
  [data-theme="glass"] .sb-sep{background:rgba(255,255,255,.14)}
  [data-theme="glass"] .btn{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.1)}
  [data-theme="glass"] .btn:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2)}
  [data-theme="glass"] .chip,[data-theme="glass"] .pill{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  /* строки внутри стеклянных панелей — hover мягче */
  [data-theme="glass"] .row:hover,
  [data-theme="glass"] .svcchip:hover,
  [data-theme="glass"] .clickrow:hover{background:rgba(255,255,255,.045)}
  /* свотч темы в футере */
  .swatch[data-t="glass"]{
    background:linear-gradient(135deg, rgba(43,92,255,.85), rgba(23,24,27,.9));
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}

</style>
<script>
  // pre-paint: применяем тему и fx до первой отрисовки (без мигания)
  try{
    var _t=localStorage.getItem('mc-theme')||'glass';
    if(_t&&_t!=='dark')document.documentElement.setAttribute('data-theme',_t);
    document.documentElement.dataset.themeName=_t;
  }catch(e){}
</script>

    </div>
  </div>
</div></div>

<script>
const $=s=>document.querySelector(s);
const esc=x=>(x==null?'':String(x)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SERVICES=[
  {id:'cron',label:'Cron',icon:'i-overview'},
  {id:'claude-local-api',label:'Local API',icon:'i-claude'},
  {id:'tg-blog-editor',label:'Blog editor',icon:'i-log'},
  {id:'tg-assistant',label:'Ассистент',icon:'i-svc-ok'},
];
// Админ-панель — конструкторы и управление сервисами (отдельно от технических данных)
const ADMIN=[
  {id:'cron',label:'Конструктор задач',icon:'i-add'},
  {id:'blog',label:'Блог',icon:'i-log'},
  {id:'sources',label:'Источники · база',icon:'i-graph'},
  {id:'blogbase',label:'Блог · база',icon:'i-log'},
  {id:'psych',label:'Ассистент · аналитика',icon:'i-svc-ok'},
  {id:'hh',label:'hh-отклик',icon:'i-ext'},
];
// темы: id, подпись, цвет-свотч (для настроек)
const THEMES=[
  {id:'glass',nm:'Glass',sw:'linear-gradient(135deg,#2b5cff 45%,#17181b 45%)'},
  {id:'dark',nm:'Тёмная',sw:'#16181d'},
  {id:'light',nm:'Светлая',sw:'linear-gradient(135deg,#ffffff 50%,#2f6fd0 50%)'},
  {id:'tactical',nm:'Tactical',sw:'#f0a830'},
  {id:'hud',nm:'HUD',sw:'#36f0d0'},
  {id:'synth',nm:'Synthwave',sw:'#ff5cc8'},
  {id:'matrix',nm:'Matrix',sw:'#36f06a'},
];
// краткое «что делает сервис» — подложка, если в services.json нет note
const SVC_DESC={
  'cron':'Планировщик: запускает крон-задачи по расписанию (дайджесты, hh-отклики, рассылки, news-ingest) и ведёт ленту запусков.',
  'claude-local-api':'Локальный Claude API через unix-сокет /tmp/claude_api.sock — крон и боты дёргают модель отсюда, без сетевого ключа.',
};
// форма-дубль статусов (Unicode-глиф + слово) — состояние читается без цвета
const DOT={ok:'●',degraded:'◐',error:'✕',err:'✕',warn:'△',idle:'○',off:'○',disabled:'○',waiting:'◔',wait:'◔',unknown:'—'};
const HCLASS={ok:'ok',degraded:'degraded',error:'err',warn:'warn',waiting:'wait',disabled:'idle',off:'idle',unknown:'unknown'};
const HWORD={ok:'ок',degraded:'сбой внутри',error:'упала',warn:'сбой',waiting:'ждёт',disabled:'выкл',unknown:'—'};

function routeFromHash(){const h=decodeURIComponent((location.hash||'').replace(/^#/,'')).trim();return h||'overview';}
let route=routeFromHash(), openErr=new Set(), prev={}, svcRisk={};
const RISK={error:0,degraded:1,warn:2,waiting:3,unknown:4,ok:5,disabled:6,off:7}; // меньше = выше (по риску)

async function api(p,o){const r=await fetch(p,o);return r.json();}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600);}
function icon(id,cls){return `<svg class="ic ${cls||''}" aria-hidden="true"><use href="#${id}"/></svg>`;}
function fmtMs(ms){return ms?(ms>1000?(ms/1000).toFixed(1)+'s':ms+'ms'):'';}

// ── навигация ──
function buildNav(){
  $('#navServices').innerHTML=SERVICES.map(s=>
    `<a data-route="svc:${s.id}" data-svc="${s.id}" role="link" tabindex="0" onclick="go('svc:${s.id}')" onkeydown="navKey(event,'svc:${s.id}')">
      ${icon(s.icon)}<span class="tx">${esc(s.label)}</span>
      <span class="end"><span class="dot unknown" id="nav-${s.id}">—</span></span></a>`).join('');
  $('#navAdmin').innerHTML=ADMIN.map(a=>
    `<a data-route="admin:${a.id}" role="link" tabindex="0" onclick="go('admin:${a.id}')" onkeydown="navKey(event,'admin:${a.id}')">
      ${icon(a.icon)}<span class="tx">${esc(a.label)}</span></a>`).join('');
}
function setActive(){document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.route===route));}
function go(r){route=r;prev={};openErr=new Set();
  try{const h='#'+r;if(location.hash!==h)location.hash=h;}catch(e){}
  setActive();render();}
window.addEventListener('hashchange',()=>{const r=routeFromHash();if(r!==route){route=r;prev={};openErr=new Set();setActive();render();}});
function navKey(e,r){if(e.key==='Enter'||e.key===' '){e.preventDefault();go(r);}}

// сайдбар — обновляется ВСЕГДА (дёшево), даже на других экранах (J5/J6)
function updateSidebar(d){
  $('#supPid').textContent=d.supervisor.pid||'—';
  $('#supSvc').textContent=`${d.stats.services_alive}/${d.stats.services_total}`;
  $('#clock').textContent=d.now; $('#pulseClock').textContent=d.now;
  $('#supDot').className='dot live '+(d.stats.services_alive===d.stats.services_total?'ok':'err');
  $('#supDot').textContent=d.stats.services_alive===d.stats.services_total?'●':'✕';
  // статус-точки сервисов в сайдбаре + риск для сортировки
  (d.services||[]).forEach(s=>{
    const st=!s.alive?'error':(s.degraded?'warn':'ok'); svcRisk[s.name]=st;
    const el=$('#nav-'+s.name);
    if(el){el.className='dot '+(HCLASS[st]||'idle');el.textContent=DOT[st]||'○';
      el.title=!s.alive?'остановлен':(s.degraded?`перезапускался ${s.restarts}×`:'работает');}
  });
  reorderNavServices();
  // бейдж тревоги у «Обзор»
  const n=d.health?d.health.attention_count:0, ov=d.health?d.health.overall:'ok';
  $('#navOverviewEnd').innerHTML=n>0?`<span class="nav-badge ${ov==='error'?'err':''}">${n}</span>`:'';
  // индикатор активного стрима Claude
  $('#navClaudeEnd').innerHTML=ccBusy?'<span class="nav-live">● live</span>':'';
}
function reorderNavServices(){
  const cont=$('#navServices');if(!cont)return;
  const links=[...cont.children];
  links.sort((a,b)=>(RISK[svcRisk[a.dataset.svc]]??5)-(RISK[svcRisk[b.dataset.svc]]??5));
  links.forEach(l=>cont.appendChild(l));
}

// ── рендер по маршруту ──
function render(){
  $('#content').classList.remove('wide');
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  if(route==='overview')return renderOverview();
  if(route==='context')return renderContext();
  if(route==='graph')return renderGraph();
  if(route==='zotero')return renderZotero();
  if(route==='sources')return renderSources();
  if(route==='capital')return renderCapital();
  if(route==='radar')return renderRadar();
  if(route==='claude')return renderClaude();
  if(route.startsWith('svc:'))return renderService(route.slice(4));
  if(route.startsWith('admin:'))return renderAdmin(route.slice(6));
}

/* ════════════════ ОБЗОР ════════════════ */
async function renderOverview(){
  $('#vTitle').textContent='Обзор';$('#vCrumb').textContent='состояние системы';$('#vActions').innerHTML='';
  let d;try{d=await api('/api/state');}catch{pulseDown();$('#content').innerHTML='<div class="empty">Пульт не получает состояние от сервера.<br>Повтор через 5с.</div>';return;}
  updateSidebar(d);updatePulse(d.health);
  if(route!=='overview')return;
  // первый каркас (один раз) — дальше точечный diff (T14)
  if(!$('#ovAttention')) buildOverviewSkeleton();
  patchAttention(d.attention,d.health);
  patchStatus(d);
  patchJobs(d.jobs.filter(j=>!j.is_example));
  patchFeed(d.feed);
}
// одна полоса статуса: сервисы (точки) + метрики пульта + вход в Claude Code
function patchStatus(d){
  const box=$('#ovStatus');if(!box)return;
  const services=d.services||[];
  const mc=services.find(s=>s.name==='mission-control')||{};
  const sorted=[...services].sort((a,b)=>{
    const sa=!a.alive?'error':a.degraded?'warn':'ok', sb=!b.alive?'error':b.degraded?'warn':'ok';
    return (RISK[sa]??5)-(RISK[sb]??5);
  });
  const inAlert=services.filter(s=>!s.alive||s.degraded).length;
  const dots=sorted.map(s=>{
    const st=!s.alive?'error':s.degraded?'warn':'ok';
    return `<button class="sdot ${HCLASS[st]}" onclick="go('svc:${jsq(s.name)}')"
      title="${esc(!s.alive?'остановлен':s.degraded?('перезапускался '+s.restarts+'×'):'работает '+s.uptime)}">
      <span class="dot">${DOT[st]}</span>${esc(s.name)}</button>`;
  }).join('');
  const health=inAlert?`<span class="sb-alert">↑ ${inAlert} в тревоге</span>`
    :`<span class="sb-ok">${services.length}/${services.length} живы</span>`;
  const html=`<div class="sb-left"><span class="sb-lab">сервисы</span>${dots}</div>
    <div class="sb-right">${health}<span class="sb-sep"></span>
      <span class="sb-metric tip" data-tip="Открытых диалогов Claude Code через пульт.">⌁ сессий <b>${d.stats.mc_sessions??0}</b></span>
      <span class="sb-metric tip" data-tip="Сколько раз супервизор перезапускал пульт.">↻ рестартов <b>${mc.restarts??0}</b></span>
      <button class="btn big" onclick="go('claude')">${icon('i-ext')} Claude Code →</button></div>`;
  if(box._sig!==html){box.innerHTML=html;box._sig=html;}
}
// человекочитаемое расписание из cron/@every
function humanSchedule(s){
  if(!s)return '';s=String(s).trim();
  if(s.startsWith('@every')){
    const m=s.replace('@every','').trim();const num=parseInt(m,10);const unit=m.replace(/[0-9.\s]/g,'');
    if(unit==='h')return num===1?'каждый час':`каждые ${num} ч`;
    if(unit==='m')return num===1?'каждую минуту':`каждые ${num} мин`;
    if(unit==='d')return num===1?'каждый день':`каждые ${num} дн`;
    if(unit==='s')return `каждые ${num} с`;
    return 'каждые '+m;
  }
  const p=s.split(/\s+/);
  if(p.length===5&&/^\d+$/.test(p[0])&&/^\d+$/.test(p[1])){
    const t=p[1].padStart(2,'0')+':'+p[0].padStart(2,'0');
    if(p[2]==='*'&&p[3]==='*'&&p[4]==='*')return 'ежедневно '+t;
    if(p[2]==='*'&&p[3]==='*')return t+' · дни '+p[4];
    return t;
  }
  return s;
}
function toggleFeed(){
  const g=$('#ovOps');if(!g)return;
  const off=g.classList.toggle('nofeed');
  const b=$('#ovFeedToggle');if(b)b.textContent=off?'◂ Лента':'Лента ▸';
  try{localStorage.setItem('mc-feed-off',off?'1':'0');}catch(e){}
}
// Mission Control больше не в списке сервисов — его метрики живут тут, на обзоре
function patchMc(d){
  const box=$('#ovMc');if(!box)return;
  const mc=(d.services||[]).find(s=>s.name==='mission-control')||{};
  const alive=mc.alive!==false;
  const html=`<span class="lab" title="это сам пульт Mission Control — вынесен из списка сервисов">пульт</span>
    <span class="svcchip" title="состояние процесса пульта"><span class="dot ${alive?'ok':'err'}">${alive?'●':'✕'}</span>
      <span class="id">mission-control</span><span class="ut">${esc(mc.uptime||'—')}</span></span>
    <span class="pill tip" data-tip="Сколько диалогов Claude Code открыто через пульт (вкладка Claude Code).">⌁ сессий: ${d.stats.mc_sessions??0}</span>
    <span class="pill tip" data-tip="Сколько раз супервизор перезапускал процесс пульта.">↻ рестартов: ${mc.restarts??0}</span>
    <span class="lab" style="margin-left:auto"><a class="svcchip" onclick="go('claude')" style="cursor:pointer">⌁ открыть Claude Code →</a></span>`;
  if(box._sig!==html){box.innerHTML=html;box._sig=html;}
}
function buildOverviewSkeleton(){
  let feedOff=false;try{feedOff=localStorage.getItem('mc-feed-off')==='1';}catch(e){}
  $('#content').innerHTML=`
    <div id="ovAttention"></div>
    <div class="statusbar" id="ovStatus"></div>
    <div class="opsgrid ${feedOff?'nofeed':''}" id="ovOps">
      <section class="opscol jobs">
        <div class="colhead"><span class="t">Крон-задачи</span><span class="badge" id="ovJobsBadge">—</span>
          <button class="feedtoggle" id="ovFeedToggle" onclick="toggleFeed()">${feedOff?'◂ Лента':'Лента ▸'}</button></div>
        <div class="jobgrid" id="ovJobs"></div>
      </section>
      <aside class="opscol feedcol" id="ovFeedCol">
        <div class="colhead"><span class="t">Лента запусков</span><span class="badge" id="ovFeedBadge"></span></div>
        <div class="feed" id="ovFeed"></div>
      </aside>
    </div>`;
}

// ── Зона 0 · Пульс ──
function updatePulse(h){
  const ov=h?h.overall:'ok', n=h?h.attention_count:0;
  const p=$('#pulse');p.className='pulse '+ov;
  const glyph=ov==='err'||ov==='error'?'✕':(ov==='degraded'?'◐':'●');
  const word=ov==='error'||ov==='err'?'СИСТЕМА · АВАРИЯ':(ov==='degraded'?'СИСТЕМА · ЕСТЬ СБОИ':'СИСТЕМА · НОРМА');
  $('#pulseVerdict').innerHTML=`<span class="vglyph">${glyph}</span> ${word}`;
  const att=$('#pulseAtt');
  if(n>0){att.textContent=`⚠ ${n} ${plural(n,'требует','требуют','требуют')} внимания`;att.classList.toggle('err',ov==='error');}
  else{att.textContent='0 аномалий';att.classList.remove('err');}
}
function pulseDown(){const p=$('#pulse');p.className='pulse err';
  $('#pulseVerdict').innerHTML='<span class="vglyph">✕</span> ПУЛЬТ НЕ ПОЛУЧАЕТ СОСТОЯНИЕ';
  $('#pulseAtt').textContent='повтор 5с';$('#supDot').className='dot err';$('#supDot').textContent='✕';}
function plural(n,a,b,c){const m=n%100,d=n%10;return m>=11&&m<=14?c:d===1?a:d>=2&&d<=4?b:c;}

// ── Зона 1 · Требует внимания (diff по entity_id) ──
function patchAttention(att,h){
  const box=$('#ovAttention');if(!box)return;
  if(!att||!att.length){
    if(box.dataset.mode!=='calm'){box.dataset.mode='calm';
      box.innerHTML=`<div class="calm">${icon('i-svc-ok')} Всё работает само · 0 аномалий — пульт спокоен.</div>`;}
    return;
  }
  box.dataset.mode='list';
  const sevN=att.filter(a=>a.severity==='error').length;
  let inner=`<div class="attention"><div class="h">${icon('i-anomaly')} Требует внимания
    <span class="n ${sevN?'err':''}">${att.length}</span></div><div id="acards"></div></div>`;
  let cards=$('#acards');
  if(!cards){box.innerHTML=inner;cards=$('#acards');}
  else { // обновить только счётчик в шапке
    const n=box.querySelector('.attention .n');n.textContent=att.length;n.className='n '+(sevN?'err':'');
  }
  diffCards(cards,att);
}
function diffCards(cont,att){
  const seen=new Set();
  att.forEach((a,i)=>{
    const key=a.kind+':'+a.entity_id;seen.add(key);
    let el=cont.querySelector(`[data-key="${cssEsc(key)}"]`);
    const html=acardInner(a);
    if(!el){el=document.createElement('div');el.dataset.key=key;el.className=acardCls(a);el.innerHTML=html;cont.appendChild(el);}
    else if(el.dataset.sig!==acardSig(a)){el.className=acardCls(a);el.innerHTML=html;el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),250);}
    el.dataset.sig=acardSig(a);
    // переустановить раскрытую ошибку, если была
    const pre=el.querySelector('.errpre');if(pre)pre.style.display=openErr.has(key)?'block':'none';
    cont.appendChild(el); // порядок по att (бэк уже отсортировал)
  });
  [...cont.children].forEach(c=>{if(!seen.has(c.dataset.key))c.remove();});
}
function acardSig(a){return [a.severity,a.reason,a.hint||'',a.error?1:0,(a.actions||[]).join(',')].join('|');}
function acardCls(a){return 'acard '+(a.severity==='error'?'err':a.severity==='info'?'info':'');}
function acardInner(a){
  const key=a.kind+':'+a.entity_id;
  const st=a.severity==='error'?'error':a.severity==='info'?'waiting':'warn';
  const dot=`<span class="dot ${HCLASS[st]}">${DOT[st]}</span>`;
  const acts=(a.actions||[]).map(ac=>attBtn(ac,a)).join('');
  const pre=a.error?`<div class="errpre" style="display:${openErr.has(key)?'block':'none'}">${esc(a.error)}</div>`:'';
  const hint=a.hint?`<div class="ahint">${icon('i-anomaly')} ${esc(a.hint)}</div>`:'';
  return `<div class="top">${dot}<span class="chip ${HCLASS[st]}">${HWORD[st]||a.severity}</span>
      <span class="id">${esc(a.entity_id)}</span><span class="badge" style="color:var(--dim);font-family:var(--mono);font-size:var(--fs-xs)">· ${a.kind==='service'?'сервис':'задача'}</span></div>
    <div class="reason">${esc(a.reason)}</div>${hint}
    <div class="acts">${acts}</div>${pre}`;
}
function attBtn(ac,a){
  const id=a.entity_id, kind=a.kind, key=kind+':'+id;
  if(ac==='run')         return `<button class="btn sm primary" onclick="runJob('${jsq(id)}',this)">${icon('i-run')} прогнать</button>`;
  if(ac==='show_error')  return a.error?`<button class="btn sm" onclick="toggleErr('${jsq(key)}',this)">${icon('i-log')} показать ошибку</button>`:'';
  if(ac==='toggle_off')  return `<button class="btn sm" onclick="toggleJob('${jsq(id)}',false)">${icon('i-mute')} заглушить</button>`;
  if(ac==='restart')     return `<button class="btn sm" onclick="restartSvc('${jsq(id)}',this)">${icon('i-restart')} перезапустить</button>`;
  if(ac==='log')         return kind==='service'
                           ? `<button class="btn sm" onclick="showSvcLog('${jsq(id)}')">${icon('i-log')} лог</button>`
                           : `<button class="btn sm" onclick="showLog('${jsq(id)}')">${icon('i-log')} лог</button>`;
  if(kind==='service')   return `<button class="btn sm" onclick="go('svc:${jsq(id)}')">${icon('i-ext')} открыть</button>`;
  return '';
}
function jsq(s){return String(s).replace(/'/g,"\\'");}
function cssEsc(s){return String(s).replace(/[^a-zA-Z0-9_:-]/g,'\\$&');}

// ── Зона 2 · ряд сервисов (здоровые ужаты) ──
function patchServiceStrip(services){
  const box=$('#ovSvc');if(!box)return;
  const sorted=[...services].sort((a,b)=>{
    const sa=!a.alive?'error':a.degraded?'warn':'ok', sb=!b.alive?'error':b.degraded?'warn':'ok';
    return (RISK[sa]??5)-(RISK[sb]??5);
  });
  const inAlert=services.filter(s=>!s.alive||s.degraded).length;
  let html=`<span class="lab">сервисы</span>`+sorted.map(s=>{
    const st=!s.alive?'error':s.degraded?'warn':'ok';
    return `<span class="svcchip" role="link" tabindex="0" onclick="go('svc:${jsq(s.name)}')" onkeydown="navKey(event,'svc:${jsq(s.name)}')"
      title="${esc(!s.alive?'остановлен':s.degraded?('перезапускался '+s.restarts+'×'):'работает '+s.uptime)}">
      <span class="dot ${HCLASS[st]}">${DOT[st]}</span><span class="id">${esc(s.name)}</span><span class="ut">${esc(s.uptime||'')}</span></span>`;
  }).join('')+(inAlert?`<span class="lab" style="margin-left:auto;color:var(--degraded)">↑ ${inAlert} в тревоге</span>`:`<span class="lab" style="margin-left:auto;color:var(--ok)">${services.length}/${services.length} живы</span>`);
  if(box._sig!==html){box.innerHTML=html;box._sig=html;}
}

// ── Крон-задачи (diff по id, сорт по риску) ──
function patchJobs(jobs){
  const cont=$('#ovJobs');if(!cont)return;
  const sorted=[...jobs].sort((a,b)=>(RISK[a.health]??5)-(RISK[b.health]??5));
  $('#ovJobsBadge').textContent=`${jobs.filter(j=>j.enabled).length} активны`;
  const seen=new Set();
  sorted.forEach(j=>{
    seen.add(j.id);
    let el=cont.querySelector(`[data-id="${cssEsc(j.id)}"]`);
    const sig=jobSig(j);
    if(!el){el=document.createElement('div');el.dataset.id=j.id;el.innerHTML=jobRowInner(j);el.className=jobRowCls(j);cont.appendChild(el);}
    else if(el.dataset.sig!==sig){el.innerHTML=jobRowInner(j);el.className=jobRowCls(j);el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),250);}
    el.dataset.sig=sig;
    const pre=el.querySelector('.errpre');if(pre)pre.style.display=openErr.has('job:'+j.id)?'block':'none';
    cont.appendChild(el);
  });
  [...cont.children].forEach(c=>{if(!seen.has(c.dataset.id))c.remove();});
}
function jobSig(j){return [j.health,j.enabled,j.last_run,j.last_ms,j.next_run,j.missing,j.last_error?1:0].join('|');}
function jobRowCls(j){return 'jobcard'+(j.health==='error'?' alert':j.health==='degraded'||j.health==='waiting'?' warn':!j.enabled?' off':'');}
function jobRowInner(j){
  const h=j.health;
  const chip=`<span class="chip ${HCLASS[h]||'unknown'}">${DOT[h]||'—'} ${HWORD[h]||h}</span>`;
  const miss=j.missing?`<span class="chip wait">◔ ждёт ${esc(j.missing)}</span>`:'';
  const hasErr=(h==='error'||h==='degraded')&&j.last_error;
  const errBtn=hasErr?`<button class="btn big errbtn" onclick="toggleErr('job:${jsq(j.id)}',this)">${icon('i-log')} Ошибка</button>`:'';
  const pre=hasErr?`<div class="errpre" style="display:${openErr.has('job:'+j.id)?'block':'none'}">${esc(j.last_error)}</div>`:'';
  const sched=humanSchedule(j.schedule);
  return `<div class="jc-head"><span class="dot ${HCLASS[h]||'unknown'}">${DOT[h]||'●'}</span>
      <span class="jc-name" title="${esc(j.id)}">${esc(j.id)}</span>${miss}<span class="sp"></span>${chip}</div>
    <div class="jc-desc">${esc(j.description)}</div>
    <div class="jc-meta"><span class="sched" title="${esc(j.schedule)}">◷ ${esc(sched)}</span>
      <span>след. <b>${esc(j.next_run)}</b></span>
      <span>посл. ${esc(j.last_run)}${j.last_ms?' · '+fmtMs(j.last_ms):''}</span></div>
    <div class="jc-acts">
      <button class="btn big primary" onclick="runJob('${jsq(j.id)}',this)">${icon('i-run')} Запустить</button>
      <button class="btn big" onclick="showLog('${jsq(j.id)}')">${icon('i-log')} Лог</button>
      ${errBtn}<span class="sp"></span>
      <button class="toggle ${j.enabled?'on':''}" role="switch" aria-checked="${j.enabled}"
        title="${j.enabled?'выключить задачу':'включить задачу'}" onclick="toggleJob('${jsq(j.id)}',${!j.enabled})"></button>
    </div>${pre}`;
}

// ── Лента (точечное добавление, скролл сохраняется) ──
function patchFeed(feed){
  const cont=$('#ovFeed');if(!cont)return;
  $('#ovFeedBadge').textContent=feed.length?feed.length:'';
  if(!feed.length){if(cont._sig!=='empty'){cont.innerHTML='<div class="empty">Запусков ещё не было — появятся после первого прогона.</div>';cont._sig='empty';}return;}
  const sig=feed.map(e=>e.ts+e.job+e.result).join('|');
  if(cont._sig===sig)return;
  const top=cont.scrollTop;
  cont.innerHTML=feed.map(feedRow).join('');cont._sig=sig;cont.scrollTop=top;
}
function feedRow(e){return `<div class="ev ${e.result==='OK'?'':'err'}"><span class="t">${esc((e.ts||'').slice(5,16))}</span>
  <span class="j">${esc(e.job)}</span><span class="chip ${e.result==='OK'?'ok':'err'}">${esc(e.result)}</span></div>`;}

// ── общие действия ──
function toggleErr(key,btn){openErr.has(key)?openErr.delete(key):openErr.add(key);
  const card=btn.closest('.acard,.row,.jobcard');const pre=card&&card.querySelector('.errpre');
  if(pre)pre.style.display=openErr.has(key)?'block':'none';}
async function runJob(id,btn){btn.disabled=true;const old=btn.innerHTML;btn.innerHTML='…';
  let r;try{r=await api('/api/cron/run',{method:'POST',body:JSON.stringify({id})});}catch(e){r={ok:false,out:e.message};}
  toast(r.ok?`▶ ${id} запущена`:`✗ ${r.out}`);btn.innerHTML=old;btn.disabled=false;setTimeout(()=>{prev={};render();},1400);}
async function toggleJob(id,en){let r;try{r=await api('/api/cron/toggle',{method:'POST',body:JSON.stringify({id,enabled:en})});}catch(e){r={ok:false,out:e.message};}
  toast(r.ok?`${id} → ${en?'on':'off'}`:`✗ ${r.out}`);prev={};render();}
async function restartSvc(name,btn){if(btn){btn.disabled=true;btn.innerHTML='…рестарт';}
  let r;try{r=await api('/api/service/restart',{method:'POST',body:JSON.stringify({name})});}catch(e){r={ok:false,out:e.message};}
  toast(r.ok?`↻ ${name}: ${r.out}`:`✗ ${r.out}`);if(btn){btn.disabled=false;}setTimeout(()=>{prev={};render();},1600);}
async function restartGlobal(){if(!confirm('Глобальный рестарт супервизора — перезапустит ВСЕ 5 сервисов. Продолжить?'))return;
  let r;try{r=await api('/api/service/restart',{method:'POST',body:'{}'});}catch(e){r={ok:false,out:e.message};}
  toast(r.ok?'↻ перезапуск всех сервисов…':'✗ '+r.out);}

async function renderService(name){
  const meta=SERVICES.find(s=>s.id===name)||{label:name};
  $('#vTitle').textContent=meta.label;$('#vCrumb').textContent='сервис · '+name;
  const single=name!=='mission-control';
  $('#vActions').innerHTML=
    (single?`<button class="btn" onclick="restartSvc('${jsq(name)}',this)">${icon('i-restart')} Перезапустить сервис</button> `:'')+
    `<button class="btn danger" onclick="restartGlobal()">${icon('i-restart')} Рестарт супервизора</button>`;
  let d;try{d=await api('/api/service/'+encodeURIComponent(name));}catch{$('#content').innerHTML='<div class="empty">Сервис не ответил.<br>Повтор через 5с.</div>';return;}
  if(route!=='svc:'+name)return;
  // обновим пульс/сайдбар фоновым state'ом (чтобы тревога была видна и тут)
  try{const ds=await api('/api/state');updateSidebar(ds);updatePulse(ds.health);}catch{}
  if(route!=='svc:'+name)return;
  const dot=d.alive?'<span class="dot ok">●</span>':'<span class="dot err">✕</span>';
  let head=`<div class="kpis">
    <div class="kpi"><div class="k">Статус</div><div class="v ${d.alive?'ok':'err'}">${dot} ${d.alive?'работает':'остановлен'}</div>
      ${d.degraded?'<div class="ctx" style="color:var(--warn)">перезапускался '+d.restarts+'×</div>':''}</div>
    <div class="kpi"><div class="k">PID</div><div class="v">${d.pid||'—'}</div></div>
    <div class="kpi"><div class="k">Аптайм</div><div class="v">${esc(d.uptime||'—')}</div></div>
    <div class="kpi"><div class="k">Перезапусков</div><div class="v ${d.restarts?'warn':''}">${d.restarts||0}</div>
      ${d.last_exit?'<div class="ctx">last_exit '+esc(d.last_exit)+'</div>':''}</div>
    ${(d.cards||[]).map(c=>kpi(c.k,c.v,c.cls)).join('')}
  </div>`;
  let body='';
  if(d.jobs){
    const jobs=[...d.jobs.filter(j=>!j.is_example)].sort((a,b)=>(RISK[a.health]??5)-(RISK[b.health]??5));
    body+=`<div class="panel"><div class="h"><span class="t">Задачи</span><span class="sp"></span>
      <span class="badge">${jobs.filter(j=>j.enabled).length} активны</span></div>
      ${jobs.length?`<div class="jobgrid" style="padding:var(--sp-3)">${jobs.map(jobRowStatic).join('')}</div>`:'<div class="empty">Задач пока нет.</div>'}</div>`;
    if(d.radar&&Object.keys(d.radar).length)body+=`<div class="svccap">${icon('i-radar')}
      Radar собирает инфополе (${d.radar.items||0} материалов) — из него <b>news-ingest</b> и дайджест берут материал.
      Полные данные базы вынесены в отдельную вкладку: <a class="svcchip" style="cursor:pointer;display:inline-flex" onclick="go('radar')"><span class="id" style="color:var(--accent)">Радар · инфополе →</span></a></div>`;
    body+=runsPanel(d.recent);
  }
  if(d.activity){
    const bm=Object.entries(d.by_model||{}).map(([m,c])=>`<span class="chip idle" style="margin-right:6px">${esc(m)}: ${c}</span>`).join('');
    body+=`<div class="panel"><div class="h"><span class="t">Активность local-API</span><span class="sp"></span><span>${bm}</span></div>
      <div class="feed">${d.activity.length?d.activity.map(apiRow).join(''):'<div class="empty">Тихо — другие процессы (крон/боты) ещё не обращались к local-API через /tmp/claude_api.sock.<br>Это норма, не ошибка.</div>'}</div></div>`;
  }
  if(d.recent&&!d.jobs)body+=runsPanel(d.recent);
  if(d.sessions)body+=`<div class="panel"><div class="h"><span class="t">Последние Claude-сессии</span></div>
    ${d.sessions.length?d.sessions.map(s=>`<div class="row"><div class="meta"><div class="name"><span class="id">${esc(s.id.slice(0,8))}</span></div><div class="desc">${esc(s.title)}</div></div><div class="when">${esc(s.created)}<br>${esc(s.model)}</div></div>`).join(''):'<div class="empty">Сессий пока нет.</div>'}</div>`;
  body+=`<div class="panel"><details><summary>Лог сервиса</summary><div class="logbox">${esc(d.log||'(лог пуст — задача ещё не запускалась)')}</div></details></div>`;
  const note=d.note||SVC_DESC[name]||'';
  const cap=note?`<div class="svccap">${icon('i-overview')} ${esc(note)}</div>`:'';
  $('#content').innerHTML=cap+head+body;
}
function jobRowStatic(j){ // страница сервиса — те же крупные карточки, что и в Обзоре
  return `<div class="${jobRowCls(j)}" data-id="${esc(j.id)}">${jobRowInner(j)}</div>`;
}
function kpi(k,v,cls){return `<div class="kpi"><div class="k">${esc(k)}</div><div class="v ${cls||''}">${v}</div></div>`;}
function runsPanel(recent){if(!recent)return '';
  return `<div class="panel"><div class="h"><span class="t">Последние запуски</span></div>
    <div class="feed">${recent.length?recent.map(feedRow).join(''):'<div class="empty">Запусков ещё не было.</div>'}</div></div>`;}
function apiRow(a){
  const full=JSON.stringify({ts:a.ts,model:a.model,ms:a.ms,ok:a.ok,prompt:a.prompt,result:a.result});
  return `<div class="act clickrow" onclick="openApiDialog(this)" data-full="${esc(full)}" title="открыть полный диалог">
    <div class="ah"><span class="dot ${a.ok?'ok':'err'}">${a.ok?'●':'✕'}</span> ${esc((a.ts||'').slice(5,16))} · ${esc(a.model)} · ${fmtMs(a.ms)}
      <span style="margin-left:auto;color:var(--accent)">открыть диалог →</span></div>
    <div class="ap">▸ ${esc(a.prompt)}</div><div class="ar">${esc(a.result)}</div></div>`;}
function openApiDialog(el){
  let a;try{a=JSON.parse(el.dataset.full);}catch{return;}
  $('#mTitle').textContent='диалог local-API · '+esc(a.model||'')+' · '+esc((a.ts||'').slice(5,16))+(a.ok?'':' · ошибка');
  $('#mBody').innerHTML=`<div style="white-space:pre-wrap;font-family:var(--mono);font-size:var(--fs-xs);line-height:1.6">`+
    `<div style="color:var(--accent);margin-bottom:5px;font-weight:600">▸ ЗАПРОС (prompt)</div>${esc(a.prompt||'(пусто)')}`+
    `<div style="color:${a.ok?'var(--ok)':'var(--err)'};margin:16px 0 5px;font-weight:600">← ОТВЕТ модели</div>${esc(a.result||'(пусто)')}</div>`;
  $('#modal').classList.add('on');}

async function rebuildCapital(btn,sync){

async function openSession(id,model){ccSession=id;$('#ccSess').textContent='resume · '+id.slice(0,8);

function addEl(cls,html){const d=document.createElement('div');d.className=cls;d.innerHTML=html;
  const t=$('#transcript');t.appendChild(d);t.scrollTop=t.scrollHeight;return d;}
function toolHint(i){i=i||{};return (i.command||i.file_path||i.path||i.pattern||i.query||Object.keys(i).slice(0,3).join(', ')||'').toString().slice(0,70);}

async function ccSend(){
  if(ccBusy)return;const ta=$('#ccInput');const prompt=ta.value.trim();if(!prompt)return;
  const model=$('#ccModel').value,permission=$('#ccPerm').value;
  ta.value='';ccBusy=true;$('#ccSend').disabled=true;
  const t=$('#transcript');if(t.querySelector('.hint'))t.innerHTML='';
  addEl('msg u','<div class="b">'+esc(prompt)+'</div>');
  const aBody=addEl('msg a','<div class="b"><span class="typing"></span></div>').querySelector('.b');let acc='';
  let res;try{res=await fetch('/api/claude/send',{method:'POST',
    body:JSON.stringify({prompt,session_id:ccSession,model,permission,cwd:ccProject})});}
  catch(e){aBody.innerHTML='<span class="cerr">сеть: '+esc(e.message)+'</span>';return done();}
  const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){const{done:fin,value}=await reader.read();if(fin)break;buf+=dec.decode(value,{stream:true});
    let nl;while((nl=buf.indexOf('\n'))>=0){const line=buf.slice(0,nl).trim();buf=buf.slice(nl+1);
      if(line){let ev;try{ev=JSON.parse(line);}catch{continue;}handle(ev);}}}
  done();
  function handle(ev){const ty=ev.type;
    if(ty==='_meta'){if(ev.is_new){ccSession=ev.session_id;$('#ccSess').textContent='сессия '+ev.session_id.slice(0,8);loadList();}
      if(ev.permission==='full')toast('полный доступ к инструментам');}
    else if(ty==='assistant'&&ev.message){for(const c of ev.message.content||[]){
      if(c.type==='text'&&c.text){acc+=c.text;aBody.textContent=acc;}
      else if(c.type==='tool_use')addEl('tool',icon('i-claude')+' <b>'+esc(c.name)+'</b> <span class="ti">'+esc(toolHint(c.input))+'</span>');}
      t.scrollTop=1e9;}
    else if(ty==='result'){const ms=ev.duration_ms?(ev.duration_ms/1000).toFixed(1)+'s':'';
      if(ev.result&&!acc){acc=ev.result;aBody.textContent=acc;}
      addEl('final','✓ готово'+(ms?' · '+ms:'')+(ev.num_turns?' · '+ev.num_turns+' ходов':'')+(ev.total_cost_usd?' · $'+ev.total_cost_usd.toFixed(4):''));}
    else if(ty==='_error')addEl('cerr','✗ '+esc(ev.error));}
  function done(){ccBusy=false;$('#ccSend').disabled=false;
    if(aBody.querySelector('.typing'))aBody.innerHTML='<span style="color:var(--dim)">(нет текстового ответа)</span>';$('#ccInput').focus();}
}

  const reader=res.body.getReader(),dec=new TextDecoder();let buf='';

    <div class="barlist">${f.by_kind.length?f.by_kind.map(x=>`<div class="barrow clickrow" onclick="radarPickKind('${jsq(x.k)}')"><span class="nm">${esc(kindRu[x.k]||x.k)}</span><span class="track"><span class="fill" style="width:${Math.round(x.n/maxK*100)}%"></span></span><span class="n">${x.n}</span></div>`).join(''):'<div class="empty">—</div>'}</div></div>`;

  box.innerHTML=`<div class="grid2">${timeline}${kinds}</div><div class="grid2">${sources}${topics||'<div></div>'}</div>`;
